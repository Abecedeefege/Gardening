# Dispatcher de notificaciones push — corre cada 30 min en horario de
# vigilia de Montevideo (UTC-3): 10:00-23:30 UTC = 07:00-20:30 local.
# Lee docs/notifications/queue.json (escrita por el agente diario de
# engagement), manda lo vencido vía Web Push (VAPID) y commitea los
# cambios de status. Ver tools/send_push.js.
#
# Secret requerido: VAPID_PRIVATE_KEY (par de docs/notifications/vapid_public.txt).
name: push-dispatch

on:
  schedule:
    # Minutos DESPLAZADOS a proposito (no */15). El scheduler de GitHub
    # encola los cron en minutos redondos (:00/:15/:30/:45) junto con los
    # de todo el mundo y los difiere bajo carga. Medido el 31/08/2026:
    # la push de las 10:00 (send_at 13:00Z) salio 17:23Z — 4 h 23 min tarde,
    # aterrizando 14:23 local. Un slot fijo que llega 4 h tarde rompe la
    # promesa horaria y el contenido atado al momento del dia.
    - cron: '7,22,37,52 10-23 * * *'
    # Medicion del 03/09/2026, ya con los minutos desplazados: la misma push
    # de las 10:00 salio 14:29Z — +89 min. Mejor que +4 h 23, pero el slot
    # sigue roto. Conclusion: no es el minuto elegido, es que GitHub difiere
    # y DESCARTA corridas cron bajo carga (13:00Z es hora pico). Contra eso
    # no alcanza con elegir mejor el tick: hay que (a) tener mas ticks en la
    # hora PREVIA a cada slot y (b) hacer que el run que si arranca ESPERE al
    # minuto exacto en vez de mandar tarde (ver paso "Esperar al slot").
    # Horas previas a los 3 slots fijos: 12Z (tarea 10:00), 13Z (experiencia
    # sabado 11:00), 20Z (experiencia lunes 18:00).
    - cron: '2,12,22,32,42,52 12,13,20,21 * * *'
  workflow_dispatch: {}
  # El cron de GitHub deriva/saltea corridas (12/06: 100 min sin tick).
  # Trigger por push a la cola: cuando el agente encola, se despacha al
  # toque. Sin loop: los commits del propio dispatcher usan GITHUB_TOKEN,
  # que no re-dispara workflows.
  push:
    branches: [main]
    paths:
      - 'docs/notifications/queue.json'

concurrency:
  group: push-dispatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-push
        working-directory: tools
        run: npm install --no-audit --no-fund

      # Un tick que arranca ANTES del slot no tiene que mandar temprano ni
      # irse: se queda esperando el minuto exacto. Asi, cualquier corrida que
      # logre arrancar dentro de la ventana previa entrega puntual, aunque
      # GitHub haya descartado los ticks siguientes. Tope 40 min para no
      # ocupar el runner de gusto (el grupo de concurrency es de este mismo
      # workflow, y el run que espera es justo el que va a mandar).
      - name: Esperar al slot si esta inminente
        run: |
          SECS=$(node -e '
            const q = require("./docs/notifications/queue.json");
            const MAX = 40 * 60 * 1000;
            const now = Date.now();
            const waits = (q.notifications || [])
              .filter(n => n.status === "pending" && n.send_at)
              .filter(n => !n.expires_at || Date.parse(n.expires_at) > Date.parse(n.send_at))
              .map(n => Date.parse(n.send_at) - now)
              .filter(ms => ms > 0 && ms <= MAX);
            console.log(waits.length ? Math.ceil(Math.min(...waits) / 1000) : 0);
          ')
          if [ "$SECS" -gt 0 ]; then
            echo "Slot inminente: esperando ${SECS}s para entregar en horario."
            sleep "$SECS"
          else
            echo "Sin slot inminente — sigo derecho."
          fi

      - name: Send due notifications
        run: node tools/send_push.js
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      - name: Commit queue updates
        run: |
          if [ -n "$(git status --porcelain docs/notifications docs/sync/push_subscription.json)" ]; then
            git config user.name "push-dispatcher"
            git config user.email "actions@users.noreply.github.com"
            git add docs/notifications docs/sync/push_subscription.json
            git commit -m "push: dispatch $(date -u +%FT%TZ)"
            # El agente diario o el sync del browser pueden pushear en el
            # medio — rebase y reintento.
            for i in 1 2 3; do
              git push origin main && break || git pull --rebase origin main
            done
          else
            echo "Sin cambios para commitear."
          fi
