# Dispatcher de notificaciones push — corre cada 30 min en horario de
# vigilia de Montevideo (UTC-3): 10:00-23:30 UTC = 07:00-20:30 local.
# Lee docs/notifications/queue.json (escrita por el agente diario de
# engagement), manda lo vencido vía Web Push (VAPID) y commitea los
# cambios de status. Ver tools/send_push.js.
#
# Secret requerido: VAPID_PRIVATE_KEY (par de docs/notifications/vapid_public.txt).
name: push-dispatch

on:
  schedule:
    # Minutos DESPLAZADOS a proposito (no */15). El scheduler de GitHub
    # encola los cron en minutos redondos (:00/:15/:30/:45) junto con los
    # de todo el mundo y los difiere bajo carga. Medido el 31/08/2026:
    # la push de las 10:00 (send_at 13:00Z) salio 17:23Z — 4 h 23 min tarde,
    # aterrizando 14:23 local. Un slot fijo que llega 4 h tarde rompe la
    # promesa horaria y el contenido atado al momento del dia.
    #
    # MEDICION 08/09/2026 sobre las 19 corridas scheduled del 05 al 07/09
    # (ver learnings.md). Lo que pasa de verdad NO es que GitHub elija mal el
    # minuto: es que ignora la enorme mayoria de los ticks declarados.
    #   - Gap real entre corridas: media 95 min, maximo 168 min, minimo 21.
    #     Declaramos hasta 10 ticks/hora y sale ~1 cada hora y media.
    #   - Peor: la PRIMERA corrida del dia nunca cae al abrir la ventana.
    #     Con el cron abriendo 10:00Z, la primera efectiva fue 13:25Z (05/09),
    #     13:38Z (06/09) y 15:47Z (07/09) — o sea 3 h 25 a 5 h 47 despues.
    #     El slot de tarea vive 13:00Z: caia SIEMPRE en ese pozo inicial.
    #     Por eso el lunes 07/09 la push de las 10:00 salio 12:48 local (+168
    #     min) y la de las 18:00 salio 19:15 (+75 min).
    # Dos correcciones, dimensionadas con esos numeros:
    #  (a) ABRIR LA VENTANA MUCHO ANTES (05Z en vez de 10Z). No manda nada
    #      antes de hora — send_push.js solo despacha lo vencido (send_at <=
    #      now) — pero corre el pozo inicial de GitHub de 5 h 47 hasta ~10:50Z,
    #      dejando ticks disponibles antes del slot de las 13:00Z.
    #  (b) SUBIR EL TOPE DE ESPERA a 200 min > el gap maximo medido (168).
    #      Asi el primer tick que arranque dentro de las ~3 h previas se
    #      queda esperando y entrega en el minuto exacto (ver "Esperar al
    #      slot"). Repo publico = minutos de runner gratis: la espera no
    #      cuesta nada y compra puntualidad.
    - cron: '7,22,37,52 5-23 * * *'
    # Densidad extra en las horas previas a los 3 slots fijos: 12Z (tarea
    # 10:00), 13Z (experiencia sabado 11:00), 20Z (experiencia lunes 18:00).
    # Con (a) y (b) esto ya es redundancia, no el mecanismo principal.
    - cron: '2,12,22,32,42,52 10,11,12,13,19,20,21 * * *'
  workflow_dispatch: {}
  # El cron de GitHub deriva/saltea corridas (12/06: 100 min sin tick).
  # Trigger por push a la cola: cuando el agente encola, se despacha al
  # toque. Sin loop: los commits del propio dispatcher usan GITHUB_TOKEN,
  # que no re-dispara workflows.
  push:
    branches: [main]
    paths:
      - 'docs/notifications/queue.json'

concurrency:
  group: push-dispatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # El paso "Esperar al slot" puede dormir hasta 330 min (ver abajo).
    # El default de GitHub son 360; se fija explicito para que quede claro
    # que la espera larga es intencional y entra con margen.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-push
        working-directory: tools
        run: npm install --no-audit --no-fund

      # Un tick que arranca ANTES del slot no tiene que mandar temprano ni
      # irse: se queda esperando el minuto exacto. Asi, cualquier corrida que
      # logre arrancar dentro de la ventana previa entrega puntual, aunque
      # GitHub haya descartado los ticks siguientes.
      #
      # Tope 200 min (era 40): el gap maximo medido entre corridas reales es
      # de 168 min, con media de 95. Con 40 min de tope, la probabilidad de
      # que un tick cayera dentro de la ventana era ~40/95 = 42 %, y para el
      # slot de las 13:00Z era ~0 % porque la primera corrida del dia nunca
      # llegaba antes de las 13:25Z. Con 200 > 168 alcanza con que arranque
      # UNA corrida en las 3 h previas — y con la ventana abriendo a las 05Z
      # hay varias. Repo publico: el runner en sleep no consume cuota.
      #
      # Guarda: si YA hay algo vencido, no se espera nada — se manda ahora y
      # el proximo tick se ocupa del slot futuro. Sin esta guarda, una push
      # atrasada quedaba retenida hasta 3 h mas por esperar a la siguiente.
      # MEDICION 09/09/2026 — EL HALLAZGO QUE CAMBIA EL MECANISMO PRINCIPAL.
      # Se compararon las corridas por `schedule` contra las por `push`:
      #   schedule -> la ventana nueva abrio 05:07Z y a las 09:15Z todavia no
      #     habia corrido NINGUNA (ultima: 00:41Z). La correccion (a) del 08/09
      #     no elimino el pozo: la primera corrida del dia sigue cayendo
      #     13:25-15:47Z, siempre DESPUES del slot de las 13:00Z.
      #   push     -> latencia medida commit -> run_started_at:
      #     eea6f5d +7 s · 1e66047 +10 s · 715f371 +7 s · b8e6074 +4 s.
      #     4 de 4 por debajo de 10 segundos.
      # O sea: el trigger `push` sobre queue.json (que ya existia) es la unica
      # via de entrega deterministica, y se estaba desperdiciando porque el
      # tope de espera la dejaba afuera.
      #
      # POR ESO EL TOPE AHORA DEPENDE DEL EVENTO (env WAIT_CAP_MIN):
      #  - push (el agente acaba de encolar): 330 min. El agente corre ~09:20Z
      #    y el slot de tarea vive 13:00Z = 220 min. Con 200 se quedaba a 20
      #    min de cubrirlo; con 330 la corrida que arranca a los 7 segundos de
      #    su propio commit duerme y entrega en el minuto exacto, sin depender
      #    del cron. Tambien cubre el slot del sabado (14:00Z = 280 min).
      #  - schedule (redundancia): 200 min, como estaba. Alcanza de sobra para
      #    los slots de tarde/noche (21:00Z tiene corridas desde las 17:33Z) y
      #    evita que un tick del mediodia bloquee el grupo de concurrencia
      #    media jornada retrasando un push `-reply-*` de /responder-tareas.
      - name: Esperar al slot si esta inminente
        env:
          WAIT_CAP_MIN: ${{ github.event_name == 'push' && '330' || '200' }}
        run: |
          SECS=$(node -e '
            const q = require("./docs/notifications/queue.json");
            const MAX = Number(process.env.WAIT_CAP_MIN || 200) * 60 * 1000;
            const now = Date.now();
            const pending = (q.notifications || [])
              .filter(n => n.status === "pending" && n.send_at)
              .filter(n => !n.expires_at || Date.parse(n.expires_at) > now);
            // Algo ya vencido -> mandar ya, no esperar.
            if (pending.some(n => Date.parse(n.send_at) <= now)) { console.log(0); }
            else {
              const waits = pending
                .map(n => Date.parse(n.send_at) - now)
                .filter(ms => ms > 0 && ms <= MAX);
              console.log(waits.length ? Math.ceil(Math.min(...waits) / 1000) : 0);
            }
          ')
          if [ "$SECS" -gt 0 ]; then
            echo "Slot inminente: esperando ${SECS}s ($((SECS / 60)) min) para entregar en horario (tope ${WAIT_CAP_MIN} min, evento ${GITHUB_EVENT_NAME})."
            sleep "$SECS"
          else
            echo "Sin slot inminente (o hay algo ya vencido) — sigo derecho."
          fi

      # Mientras esta corrida dormia puede haber entrado algo nuevo a la cola
      # (tipico: un push `-reply-*` de /responder-tareas), y el grupo de
      # concurrencia impide que su propia corrida arranque hasta que esta
      # termine. Refrescando el checkout antes de mandar, esta corrida se hace
      # cargo tambien de eso en vez de dejarlo esperando.
      # `reset --hard` NO borra untracked: tools/node_modules sobrevive.
      - name: Refrescar la cola despues de la espera
        run: |
          git fetch origin main --quiet
          git reset --hard origin/main --quiet
          echo "Cola en $(git rev-parse --short HEAD)."

      - name: Health check del backend (token del servidor)
        run: node tools/health_check.js

      - name: Send due notifications
        run: node tools/send_push.js
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      - name: Commit queue updates
        run: |
          if [ -n "$(git status --porcelain docs/notifications docs/sync/push_subscription.json)" ]; then
            git config user.name "push-dispatcher"
            git config user.email "actions@users.noreply.github.com"
            git add docs/notifications docs/sync/push_subscription.json
            git commit -m "push: dispatch $(date -u +%FT%TZ)"
            # El agente diario o el sync del browser pueden pushear en el
            # medio — rebase y reintento.
            for i in 1 2 3; do
              git push origin main && break || git pull --rebase origin main
            done
          else
            echo "Sin cambios para commitear."
          fi
