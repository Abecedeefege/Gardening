<!doctype html>
<!--
SPLASH FOTOGRÁFICO 1/3 — «Amanecer en la pileta» (day-for-night)
Técnica de cine: nuit américaine. La foto REAL del fondo (misma toma que la del
usuario: pileta + palmera + quincho) arranca gradada a noche cerrada (multiply
índigo + estrellas compuestas encima), pasa por hora azul y hora dorada
(overlays screen/soft-light cuyo peso sigue el progreso de carga) y aterriza en
el color natural de la foto. Detalles de oficio: Ken Burns push-in lento
(transform, compositor-only), barrido especular sobre el agua de la pileta al
70-90%, rayos de dios desde arriba a la derecha en la fase dorada, y el mismo
contrato del splash de producción (curva con vacilación, % en pill, microcopy,
wash a crema + settle del título). Para producción se integraría igual que
«Primera luz» (bloque inline en build.py) con la foto servida desde
docs/images/ (no base64) para cachear. Reduced-motion: crossfades puros.
-->
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04061a">
<title>Splash foto A — Amanecer en la pileta</title>
<style>
  html,body{height:100%;margin:0;background:#04061a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #sp{position:fixed;inset:0;overflow:hidden;background:#04061a;user-select:none;cursor:pointer}
  #sp *{margin:0;padding:0;box-sizing:border-box}

  /* foto + Ken Burns (transform-only) */
  #ph{position:absolute;inset:-4%;width:108%;height:108%}
  #ph img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block;
    transform:scale(1.16);transform-origin:52% 64%;will-change:transform}

  /* gradación: capas de color, no filters por frame */
  .gr{position:absolute;inset:0;pointer-events:none;will-change:opacity}
  #grNight{background:linear-gradient(180deg,#050a2e 0%,#0a1140 46%,#141a4a 100%);mix-blend-mode:multiply;opacity:1}
  #grNight2{background:#0a1032;mix-blend-mode:color;opacity:.55}
  #grBlue{background:linear-gradient(180deg,rgba(70,100,180,.30),rgba(40,60,130,.16) 60%,rgba(20,30,80,.22));mix-blend-mode:screen;opacity:0}
  #grGold{background:radial-gradient(ellipse 120% 80% at 76% 8%,rgba(255,166,70,.55),rgba(255,120,60,.18) 46%,transparent 72%);mix-blend-mode:screen;opacity:0}
  #grWarm{background:linear-gradient(200deg,rgba(255,190,120,.20),transparent 55%);mix-blend-mode:soft-light;opacity:0}
  #vig{background:radial-gradient(ellipse 120% 92% at 50% 46%,transparent 52%,rgba(2,4,16,.62) 100%)}

  /* estrellas sobre la franja de cielo */
  #stars{position:absolute;inset:0 0 55% 0;pointer-events:none}
  .st{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.5);animation:tw ease-in-out infinite alternate;will-change:opacity}
  @keyframes tw{from{opacity:.3}to{opacity:1}}

  /* barrido de primera luz sobre el agua */
  #sweep{position:absolute;left:-40%;right:auto;top:58%;width:46%;height:26%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,224,170,.55) 45%,rgba(255,244,214,.75) 52%,rgba(255,224,170,.5) 60%,transparent);
    mix-blend-mode:screen;filter:blur(7px);opacity:0;transform:skewX(-14deg);will-change:transform,opacity}

  /* rayos de dios */
  #rays{position:absolute;left:30%;top:-24%;width:150%;height:120%;pointer-events:none;opacity:0;mix-blend-mode:screen;
    background:conic-gradient(from 208deg at 78% 10%,transparent 0deg,rgba(255,208,130,.16) 7deg,transparent 15deg,rgba(255,208,130,.11) 23deg,transparent 32deg,rgba(255,208,130,.14) 41deg,transparent 52deg);
    transform-origin:78% 10%;animation:raysp 14s linear infinite;will-change:opacity}
  @keyframes raysp{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}

  /* HUD */
  #pctW{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);z-index:9;opacity:0;transition:opacity .5s}
  #pctW .in{font:500 12px/1 inherit;font-family:inherit;letter-spacing:.14em;font-variant-numeric:tabular-nums;color:#faf4e8;background:rgba(4,6,22,.6);padding:6px 11px;border-radius:999px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #copy{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:9;text-align:center;padding:0 28px;font:400 14.5px/1.45 inherit;font-family:inherit;color:rgba(248,243,232,.94);text-shadow:0 1px 8px rgba(3,5,18,.75);transition:opacity .24s ease}

  /* remate */
  #wash{position:absolute;inset:0;z-index:11;background:radial-gradient(circle at 50% 42%,#fff6dc 0%,#f8f9ec 34%,#f5faf0 62%);clip-path:circle(0% at 50% 42%);transition:clip-path 1.05s cubic-bezier(.66,0,.22,1);pointer-events:none}
  #sp.washing #wash{clip-path:circle(142% at 50% 42%)}
  #sp.washing #pctW,#sp.washing #copy{opacity:0!important;transition:opacity .4s ease}
  #final{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;visibility:hidden}
  #sp.reveal #final{visibility:visible}
  #final .title{font:400 clamp(34px,9.5vw,46px)/1.1 Georgia,serif;color:#2d5016;letter-spacing:.13em;opacity:0;transform:translateY(14px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.16,.8,.24,1),letter-spacing 1.15s cubic-bezier(.2,.7,.2,1)}
  #final .sub{margin-top:10px;font:600 11px inherit;font-family:inherit;letter-spacing:.22em;text-transform:uppercase;color:#4a5f3d;opacity:0;transform:translateY(10px);transition:opacity .7s ease .15s,transform .8s cubic-bezier(.16,.8,.24,1) .15s}
  #final .cta{display:inline-flex;align-items:center;gap:9px;margin-top:24px;padding:13px 26px;border-radius:999px;background:#2d5016;color:#f5faf0;text-decoration:none;font:600 15px/1 inherit;font-family:inherit;box-shadow:0 10px 24px -8px rgba(45,80,22,.45);opacity:0;transform:translateY(12px);transition:opacity .7s ease .3s,transform .8s cubic-bezier(.16,.8,.24,1) .3s}
  #sp.reveal .title{opacity:1;transform:none;letter-spacing:.02em}
  #sp.reveal .sub,#sp.reveal .cta{opacity:1;transform:none}

  #again{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:15;background:rgba(10,14,34,.3);border:1px solid rgba(240,236,224,.3);color:rgba(240,236,224,.9);font:500 12px inherit;font-family:inherit;padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
  #foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:10;text-align:center;font:400 10px inherit;font-family:inherit;letter-spacing:.07em;text-transform:uppercase;color:rgba(240,236,224,.6);pointer-events:none}
  #sp.reveal~#foot{color:rgba(90,110,75,.9)}

  @media (prefers-reduced-motion: reduce){
    #ph img{transform:none!important}
    .st,#rays{animation:none!important}
    #sweep{display:none}
    #wash{clip-path:none!important;opacity:0;transition:opacity .95s ease}
    #sp.washing #wash{opacity:1}
    #final .title,#final .sub,#final .cta{transform:none!important;letter-spacing:.02em!important;transition:opacity .8s ease!important}
  }
</style>
</head>

(()=>{
'use strict';

const DUR=5000;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
const KEYS=[[0,0],[.13,.05],[.3,.4],[.5,.64],[.62,.74],[.72,.78],[.84,.81],[.92,.92],[1,1]];
function curve(u){
  if(u>=1)return 1;
  for(let i=1;i<KEYS.length;i++){
    if(u<=KEYS[i][0]){const a=KEYS[i-1],b=KEYS[i],k=(u-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*(k*k*(3-2*k))}
  }
  return 1;
}
const COPY=['Todavía es de noche en el fondo…','El agua planchada — ni una rana…','Se apaga el lucero sobre la pileta…','Primera luz en el agua. Llegaste.'];

  }

function render(p){

  grN.style.opacity=(1-ss(.06,.6,p)).toFixed(3);
  grN2.style.opacity=(.55*(1-ss(.1,.55,p))).toFixed(3);
  grB.style.opacity=(ss(.15,.4,p)*(1-ss(.55,.8,p))).toFixed(3);
  grG.style.opacity=(ss(.45,.72,p)*(1-.6*ss(.9,1,p))).toFixed(3);
  grW.style.opacity=ss(.5,.85,p).toFixed(3);
  vig.style.opacity=(1-.55*p).toFixed(3);
  rays.style.opacity=(.9*ss(.55,.75,p)*(1-ss(.93,1,p))).toFixed(3);
  const sw=ss(.62,.88,p);
  sweep.style.opacity=(sw>0&&sw<1?.4+.5*Math.sin(sw*Math.PI):0).toFixed(3);
  sweep.style.transform=`skewX(-14deg) translateX(${(sw*320).toFixed(1)}%)`;
  for(const st of starEls)st.el.style.opacity=(1-ss(st.th-.05,st.th+.04,p)).toFixed(3);
  const n=Math.round(p*100);
  pct.textContent=n;pctW.setAttribute('aria-valuenow',n);
  pctW.style.opacity=p>.04?'1':'0';
}
function frame(now){
  if(!t0)t0=now;
  let u=Math.min((now-t0)/DUR,1);
  if(skip)u=Math.min(u+.55,1);
  if(skip)t0=now-u*DUR;
  const p=curve(u);
  if(ci<COPY.length-1&&(now-t0)>=CT[ci+1]){
    ci++;const txt=COPY[ci];clearTimeout(copyT);
    copy.style.opacity=0;
    copyT=setTimeout(()=>{copy.textContent=txt;copy.style.opacity=1},220);
  }
  render(p);
  if(u<1)raf=requestAnimationFrame(frame);else finale();
}
function finale(){
  finaleOn=true;
  finT.push(setTimeout(()=>sp.classList.add('washing'),200));
  finT.push(setTimeout(()=>sp.classList.add('reveal'),700));
}
function reset(){
  cancelAnimationFrame(raf);clearTimeout(copyT);finT.forEach(clearTimeout);finT=[];
  sp.classList.remove('washing','reveal');
  skip=false;finaleOn=false;t0=0;ci=0;
  copy.textContent=COPY[0];copy.style.opacity=1;
  buildStars();render(0);
  raf=requestAnimationFrame(frame);
}
sp.addEventListener('pointerdown',e=>{
  if(e.target.closest('a,button'))return;
  if(!finaleOn)skip=true;
},{passive:true});
$('again').addEventListener('click',reset);
buildStars();render(0);
raf=requestAnimationFrame(frame);
})();
</script>
