<!doctype html>
<!--
SPLASH FOTOGRÁFICO 3/3 — «Hora dorada» (otoño compuesto + partículas)
Técnica de cine y animación: la foto REAL de la pileta con la copa del
liquidámbar ENCENDIDA a otoño por compositing (hue-shift selectivo verde→rojo
horneado con máscara elíptica suave sobre la copa — mismo encuadre que la foto
de otoño del usuario). Sobre eso: dolly lateral lento (Ken Burns con drift en
X), gradación de hora dorada que sube con la carga, BLOOM óptico (la misma
foto duplicada, desenfocada, en blend screen, que respira en el pico dorado),
cadena de lens flare desde el sol, y ~16 hojas de otoño cayendo en 2 planos de
profundidad (sprites SVG con vaivén y rotación propios, el plano de atrás
desenfocado). Mismo contrato del splash (curva con vacilación, % pill,
microcopy, wash a crema + settle). Producción: foto desde docs/images/,
partículas se apagan en reduced-motion.
-->
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1208">
<title>Splash foto C — Hora dorada</title>
<style>
  html,body{height:100%;margin:0;background:#1a1208;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #sp{position:fixed;inset:0;overflow:hidden;background:#1a1208;user-select:none;cursor:pointer}
  #sp *{margin:0;padding:0;box-sizing:border-box}

  #ph{position:absolute;inset:-5%;width:110%;height:110%}
  #ph img{width:100%;height:100%;object-fit:cover;object-position:52% 55%;display:block;
    transform:scale(1.15);transform-origin:55% 45%;will-change:transform}
  /* bloom óptico: misma foto, blur estático, solo anima opacity */
  #bloom{position:absolute;inset:-5%;width:110%;height:110%;pointer-events:none;mix-blend-mode:screen;opacity:0;will-change:opacity}
  #bloom img{width:100%;height:100%;object-fit:cover;object-position:52% 55%;display:block;
    filter:blur(14px) saturate(1.35) brightness(1.12);transform:scale(1.15);transform-origin:55% 45%;will-change:transform}

  .gr{position:absolute;inset:0;pointer-events:none;will-change:opacity}
  #grFlat{background:#3a3226;mix-blend-mode:saturation;opacity:.7}
  #grDim{background:linear-gradient(180deg,#241a10,#1c150c);mix-blend-mode:multiply;opacity:.82}
  #grGold{background:radial-gradient(ellipse 130% 90% at 24% 6%,rgba(255,178,84,.5),rgba(255,140,70,.16) 48%,transparent 74%);mix-blend-mode:screen;opacity:0}
  #grRose{background:linear-gradient(160deg,rgba(255,150,110,.16),transparent 50%,rgba(120,60,150,.10));mix-blend-mode:soft-light;opacity:0}
  #vig{background:radial-gradient(ellipse 125% 95% at 50% 45%,transparent 54%,rgba(20,10,4,.6) 100%)}

  /* lens flare desde el sol (arriba-izquierda) */
  #flare{position:absolute;inset:0;pointer-events:none;opacity:0;will-change:opacity}
  #flare i{position:absolute;border-radius:50%;mix-blend-mode:screen}
  #flare .f1{left:20%;top:9%;width:36px;height:36px;background:radial-gradient(circle,rgba(255,226,170,.8),transparent 70%)}
  #flare .f2{left:33%;top:24%;width:14px;height:14px;background:radial-gradient(circle,rgba(255,190,140,.55),transparent 70%)}
  #flare .f3{left:45%;top:40%;width:26px;height:26px;background:radial-gradient(circle,rgba(190,255,190,.3),transparent 70%)}
  #flare .f4{left:58%;top:56%;width:10px;height:10px;background:radial-gradient(circle,rgba(255,220,180,.5),transparent 70%)}

  /* hojas cayendo — 2 planos */
  #leaves,#leaves2{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease;will-change:opacity}
  #leaves2{filter:blur(1.4px)}
  #sp.leafy #leaves,#sp.leafy #leaves2{opacity:1}
  .lf{position:absolute;top:-6%;will-change:transform;animation:fall linear infinite}
  .lf svg{display:block;animation:sway ease-in-out infinite alternate}
  @keyframes fall{from{transform:translateY(-8vh) rotate(0deg)}to{transform:translateY(112vh) rotate(340deg)}}
  @keyframes sway{from{transform:translateX(-2.6vw) rotate(-38deg)}to{transform:translateX(2.6vw) rotate(42deg)}}

  #pctW{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);z-index:9;opacity:0;transition:opacity .5s}
  #pctW .in{font:500 12px/1 inherit;font-family:inherit;letter-spacing:.14em;font-variant-numeric:tabular-nums;color:#fff3e0;background:rgba(26,16,6,.58);padding:6px 11px;border-radius:999px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #copy{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:9;text-align:center;padding:0 28px;font:400 14.5px/1.45 inherit;font-family:inherit;color:rgba(255,246,232,.95);text-shadow:0 1px 8px rgba(20,10,4,.8);transition:opacity .24s ease}

  #wash{position:absolute;inset:0;z-index:11;background:radial-gradient(circle at 52% 40%,#fff6dc 0%,#f8f9ec 34%,#f5faf0 62%);clip-path:circle(0% at 52% 40%);transition:clip-path 1.05s cubic-bezier(.66,0,.22,1);pointer-events:none}
  #sp.washing #wash{clip-path:circle(142% at 52% 40%)}
  #sp.washing #pctW,#sp.washing #copy{opacity:0!important;transition:opacity .4s ease}
  #final{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;visibility:hidden}
  #sp.reveal #final{visibility:visible}
  #final .title{font:400 clamp(34px,9.5vw,46px)/1.1 Georgia,serif;color:#2d5016;letter-spacing:.13em;opacity:0;transform:translateY(14px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.16,.8,.24,1),letter-spacing 1.15s cubic-bezier(.2,.7,.2,1)}
  #final .sub{margin-top:10px;font:600 11px inherit;font-family:inherit;letter-spacing:.22em;text-transform:uppercase;color:#4a5f3d;opacity:0;transform:translateY(10px);transition:opacity .7s ease .15s,transform .8s cubic-bezier(.16,.8,.24,1) .15s}
  #final .cta{display:inline-flex;align-items:center;gap:9px;margin-top:24px;padding:13px 26px;border-radius:999px;background:#2d5016;color:#f5faf0;text-decoration:none;font:600 15px/1 inherit;font-family:inherit;box-shadow:0 10px 24px -8px rgba(45,80,22,.45);opacity:0;transform:translateY(12px);transition:opacity .7s ease .3s,transform .8s cubic-bezier(.16,.8,.24,1) .3s}
  #sp.reveal .title{opacity:1;transform:none;letter-spacing:.02em}
  #sp.reveal .sub,#sp.reveal .cta{opacity:1;transform:none}

  #again{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:15;background:rgba(30,18,8,.4);border:1px solid rgba(255,240,220,.3);color:rgba(255,240,220,.9);font:500 12px inherit;font-family:inherit;padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
  #foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:10;text-align:center;font:400 10px inherit;font-family:inherit;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,240,220,.6);pointer-events:none}
  #sp.reveal~#foot{color:rgba(90,110,75,.9)}

  @media (prefers-reduced-motion: reduce){
    #ph img,#bloom img{transform:none!important}
    .lf,.lf svg{animation:none!important}
    #leaves,#leaves2{display:none}
    #wash{clip-path:none!important;opacity:0;transition:opacity .95s ease}
    #sp.washing #wash{opacity:1}
    #final .title,#final .sub,#final .cta{transform:none!important;letter-spacing:.02em!important;transition:opacity .8s ease!important}
  }
</style>
</head>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const sp=$('sp'),img=$('phimg'),bimg=$('bloomimg'),bloom=$('bloom'),grF=$('grFlat'),

const DUR=5200;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
const KEYS=[[0,0],[.13,.05],[.3,.4],[.5,.64],[.62,.74],[.72,.78],[.84,.81],[.92,.92],[1,1]];
function curve(u){
  if(u>=1)return 1;
  for(let i=1;i<KEYS.length;i++){
    if(u<=KEYS[i][0]){const a=KEYS[i-1],b=KEYS[i],k=(u-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*(k*k*(3-2*k))}
  }
  return 1;
}
const COPY=['Última luz de la tarde…','El liquidámbar prendido fuego…','Caen las hojas que quedaban…','Hora dorada. Pasá antes que oscurezca.'];

function buildLeaves(){

    const el=document.createElement('span');el.className='lf';
    const backLayer=i%2===0;
    const size=backLayer?9+Math.random()*5:13+Math.random()*8;
    el.innerHTML=LEAF.replace(/__S__/g,size.toFixed(0)).replace('__C__',LCOL[i%LCOL.length]);

  grG.style.opacity=(ss(.3,.7,p)*(1-.45*ss(.92,1,p))).toFixed(3);
  grR.style.opacity=ss(.4,.8,p).toFixed(3);
  bloom.style.opacity=(.24*ss(.45,.75,p)*(1-.5*ss(.93,1,p))).toFixed(3);
  flare.style.opacity=(ss(.55,.78,p)*(1-ss(.94,1,p))).toFixed(3);
  vig.style.opacity=(1-.45*p).toFixed(3);
  if(!reduced&&!leafy&&p>=.32){leafy=true;sp.classList.add('leafy')}
  const n=Math.round(p*100);
  pct.textContent=n;pctW.setAttribute('aria-valuenow',n);
  pctW.style.opacity=p>.04?'1':'0';
}
function frame(now){
  if(!t0)t0=now;
  let u=Math.min((now-t0)/DUR,1);
  if(skip){u=Math.min(u+.55,1);t0=now-u*DUR}
  const p=curve(u);
  if(ci<COPY.length-1&&(now-t0)>=CT[ci+1]){
    ci++;const txt=COPY[ci];clearTimeout(copyT);
    copy.style.opacity=0;
    copyT=setTimeout(()=>{copy.textContent=txt;copy.style.opacity=1},220);
  }
  render(p);
  if(u<1)raf=requestAnimationFrame(frame);else finale();
}
function finale(){
  finaleOn=true;
  finT.push(setTimeout(()=>sp.classList.add('washing'),200));
  finT.push(setTimeout(()=>{sp.classList.add('reveal');sp.classList.remove('leafy')},720));
}
function reset(){
  cancelAnimationFrame(raf);clearTimeout(copyT);finT.forEach(clearTimeout);finT=[];
  sp.classList.remove('washing','reveal','leafy');
  skip=false;finaleOn=false;leafy=false;t0=0;ci=0;
  copy.textContent=COPY[0];copy.style.opacity=1;
  buildLeaves();render(0);
  raf=requestAnimationFrame(frame);
}
sp.addEventListener('pointerdown',e=>{
  if(e.target.closest('a,button'))return;
  if(!finaleOn)skip=true;
},{passive:true});
$('again').addEventListener('click',reset);
buildLeaves();render(0);
raf=requestAnimationFrame(frame);
})();
</script>
