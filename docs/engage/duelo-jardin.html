var EM={fru:'🍑',perf:'🌸',trep:'🌿',nat:'🇺🇾',def:'🌱'};
function emoji(p){ return p.fru?'🍑':p.perf?'🌸':p.trep?'🌿':p.nat?'🌳':'🌱'; }
var DIMS=[
 {key:'nat', q:'¿Cuál es NATIVA del Uruguay?', e:function(w){return w.name+' es nativa del Uruguay/región. La otra es exótica (introducida).';}},
 {key:'fru', q:'¿Cuál te da FRUTA para comer?', e:function(w){return w.name+' es frutal. La otra es ornamental.';}},
 {key:'perf', q:'¿Cuál es AROMÁTICA / perfumada?', e:function(w){return w.name+' destaca por su perfume o aroma.';}},
 {key:'trep', q:'¿Cuál es TREPADORA?', e:function(w){return w.name+' es trepadora: necesita soporte para crecer.';}},
];
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
// armar duelos válidos: 1 con la prop, 1 sin
function makeRounds(n){
  var out=[], tries=0;
  while(out.length<n && tries<400){ tries++;
    var d=rnd(DIMS); var yes=P.filter(function(p){return p[d.key];}); var no=P.filter(function(p){return !p[d.key];});
    if(!yes.length||!no.length) continue;
    var a=rnd(yes), b=rnd(no); if(a.code===b.code) continue;
    var pair=[a,b]; if(Math.random()<.5) pair=[b,a];
    out.push({dim:d, win:a, cards:pair});
  }
  return out;
}
var R=makeRounds(6), idx=0, score=0, answered=false;
var q=document.getElementById('q'),cA=document.getElementById('cA'),cB=document.getElementById('cB'),
    expl=document.getElementById('expl'),nextb=document.getElementById('next'),rmeta=document.getElementById('rmeta'),smeta=document.getElementById('smeta');
function paint(btn,p){ btn.innerHTML='<div class="em">'+emoji(p)+'</div><div class="nm">'+p.name+'</div><div class="cd">'+p.code+'</div>'; btn.className='pcard'; btn.disabled=false; }
function render(){ answered=false; var r=R[idx]; q.textContent=r.dim.q; paint(cA,r.cards[0]); paint(cB,r.cards[1]);
  rmeta.textContent='Duelo '+(idx+1)+' de '+R.length; smeta.textContent=score+' ✓'; expl.className='expl'; nextb.className='next';
  nextb.textContent= idx===R.length-1?'Ver resultado →':'Siguiente →'; }
function pick(btn,p){ if(answered)return; answered=true; var r=R[idx]; var ok=p.code===r.win.code;
  [cA,cB].forEach(function(b){ b.disabled=true; }); var winBtn=(r.cards[0].code===r.win.code)?cA:cB;
  if(ok){ btn.classList.add('ok'); score++; } else { btn.classList.add('bad'); winBtn.classList.add('ok'); }
  smeta.textContent=score+' ✓'; expl.innerHTML=(ok?'✅ ¡Bien! ':'❌ ')+r.dim.e(r.win); expl.classList.add('show'); nextb.classList.add('show');
  engageReact('duelo-r'+(idx+1), ok?'correct':'wrong'); }
cA.addEventListener('click',function(){pick(cA,R[idx].cards[0]);}); cB.addEventListener('click',function(){pick(cB,R[idx].cards[1]);});
nextb.addEventListener('click',function(){ if(!answered)return; if(idx<R.length-1){idx++;render();window.scrollTo({top:0,behavior:'smooth'});} else finish(); });
function finish(){ document.getElementById('game').classList.add('hidden'); document.getElementById('end').classList.remove('hidden');
  var sb=document.getElementById('sb'),n=0; var iv=setInterval(function(){n++;sb.textContent=n;if(n>=score)clearInterval(iv);},170); if(score===0)sb.textContent='0';
  document.getElementById('ss').textContent='de '+R.length+' duelos ganados';
  var p=score/R.length; document.getElementById('bd').textContent= p===1?'🏆 ¡Imbatible!':p>=.6?'🌿 Buen ojo':p>=.3?'🌱 Vas aprendiendo':'😅 A repasar el jardín';
  engageReact('duelo-score', score+'/'+R.length); }
render();
