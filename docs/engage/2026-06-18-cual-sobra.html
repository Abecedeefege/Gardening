<style>

  .scoresub{ font-size:16px; color:#5a6b4a; } .badge{ font-size:20px; font-weight:800; color:var(--verde); margin:10px 0; }
  .replay{ margin-top:14px; display:flex; flex-direction:column; gap:10px; } .replay button{ padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:800; cursor:pointer; }

  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style></head><body>
<div class="top"><a href="https://gardening-chi.vercel.app/index.html">← Volver al sitio estable</a><h1>🎯 ¿Cuál es la intrusa?</h1></div>
<p class="lead">Cuatro plantas tuyas. Tres comparten algo; una sola no. Encontrá la que sobra.</p>
<div class="meta"><span id="rmeta">Ronda 1</span><span id="smeta">0 ✓</span></div>
<div id="game">
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <div class="expl" id="expl"></div>
  <button class="next" id="next">Siguiente →</button>
</div>
<div id="end" class="final hidden">
  <div class="scorebig" id="sb">0</div><div class="scoresub" id="ss"></div><div class="badge" id="bd"></div>
  <div class="replay">
    <button class="again" onclick="location.reload()">🔄 Otra ronda</button>
    <button class="home" onclick="location.href='https://gardening-chi.vercel.app/index.html#curiosidades'">Ver curiosidades →</button>
  </div>
</div>
<p class="lead" style="text-align:center; margin-top:30px; border-top:1px solid #e2e7d6; padding-top:22px;">✅ Aprobaste este juego — ya es parte fija del jardín. Lo encontrás como <b>«🎯 ¿Cuál sobra?»</b> en el inicio.</p>
<div class="engage-actions"><a href="https://gardening-chi.vercel.app/index.html" style="text-align:center; text-decoration:none; padding:15px; border-radius:14px; background:#fff; color:#5a6b4a; border:1px solid #d7e0c9; font-weight:800; font-size:15px;">← Volver al sitio estable</a></div>
<script src="engage.js"></script>
<script>
var P = [{"code":"F-1","name":"Guayabo del país","zone":"frente","nat":true,"fru":true,"perf":false,"trep":false},{"code":"F-2","name":"Bignonia rosada / Podranea","zone":"frente","nat":false,"fru":false,"perf":false,"trep":true},{"code":"F-3","name":"Fotinia","zone":"frente","nat":false,"fru":false,"perf":false,"trep":false},{"code":"F-4","name":"Ciruelo de jardín","zone":"frente","nat":false,"fru":true,"perf":false,"trep":false},{"code":"F-5","name":"Coronita de novia (?)","zone":"frente","nat":false,"fru":false,"perf":false,"trep":false},{"code":"F-7","name":"Abelia","zone":"frente","nat":false,"fru":false,"perf":false,"trep":false},{"code":"F-8","name":"Aguaribay / Molle","zone":"frente","nat":true,"fru":false,"perf":true,"trep":false},{"code":"F-9","name":"Ligustro","zone":"frente","nat":false,"fru":false,"perf":false,"trep":false},{"code":"F-10","name":"Fresno (americano)","zone":"frente","nat":false,"fru":false,"perf":false,"trep":false},{"code":"B-1","name":"Santa Rita / Buganvilia","zone":"fondo","nat":false,"fru":false,"perf":false,"trep":true},{"code":"B-3","name":"Jazmín de leche / estrellado","zone":"fondo","nat":false,"fru":false,"perf":true,"trep":true},{"code":"B-4","name":"Hibisco / Rosa china","zone":"fondo","nat":false,"fru":false,"perf":false,"trep":false},{"code":"B-5a","name":"Hortensia","zone":"fondo","nat":false,"fru":false,"perf":false,"trep":false},{"code":"B-7","name":"Azarero / Pitósporo","zone":"fondo","nat":false,"fru":false,"perf":true,"trep":false},{"code":"B-8","name":"Palmera pindó","zone":"fondo","nat":true,"fru":true,"perf":false,"trep":false},{"code":"B-9","name":"Crespón / Mirto de crepe","zone":"fondo","nat":false,"fru":false,"perf":false,"trep":false},{"code":"B-10","name":"Lavanda","zone":"fondo","nat":false,"fru":false,"perf":true,"trep":false},{"code":"B-13","name":"Clivia / Lirio del Cabo","zone":"fondo","nat":false,"fru":false,"perf":false,"trep":false},{"code":"B-14","name":"Lapachillo","zone":"fondo","nat":true,"fru":false,"perf":false,"trep":false},{"code":"B-15","name":"Hiedra común","zone":"fondo","nat":false,"fru":false,"perf":false,"trep":true},{"code":"B-16","name":"Anacahuita","zone":"fondo","nat":true,"fru":false,"perf":false,"trep":false},{"code":"B-18","name":"Rosa de Siria / Althea","zone":"fondo","nat":false,"fru":false,"perf":false,"trep":false},{"code":"B-22","name":"Palta uruguaya","zone":"fondo","nat":false,"fru":true,"perf":false,"trep":false},{"code":"B-23","name":"Limonero","zone":"fondo","nat":false,"fru":true,"perf":true,"trep":false},{"code":"B-24","name":"Mandarina criolla","zone":"fondo","nat":false,"fru":true,"perf":false,"trep":false},{"code":"B-25","name":"Gardenia / Jazmín del Cabo","zone":"fondo","nat":false,"fru":false,"perf":true,"trep":false},{"code":"B-26","name":"Romero","zone":"fondo","nat":false,"fru":false,"perf":true,"trep":false},{"code":"B-27","name":"Mirto común","zone":"fondo","nat":false,"fru":false,"perf":true,"trep":false},{"code":"B-29","name":"Lantana / Camará","zone":"fondo","nat":true,"fru":false,"perf":false,"trep":false},{"code":"B-30","name":"Durazno","zone":"fondo","nat":false,"fru":true,"perf":false,"trep":false},{"code":"B-32","name":"Viraró","zone":"fondo","nat":true,"fru":false,"perf":false,"trep":false},{"code":"B-36","name":"Palta Haas","zone":"fondo","nat":false,"fru":true,"perf":false,"trep":false},{"code":"B-37","name":"Liquidámbar","zone":"fondo","nat":false,"fru":false,"perf":false,"trep":false},{"code":"B-38","name":"Ciruela amarilla","zone":"fondo","nat":false,"fru":true,"perf":false,"trep":false},{"code":"B-39","name":"Pera Williams","zone":"fondo","nat":false,"fru":true,"perf":false,"trep":false},{"code":"B-41","name":"Caqui / Persimón","zone":"fondo","nat":false,"fru":true,"perf":false,"trep":false},{"code":"B-42","name":"Pata de vaca","zone":"fondo","nat":true,"fru":false,"perf":false,"trep":false}];
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
// Cada categoría: 3 plantas con el rasgo (true) + 1 intrusa (false). Todo derivado de
// datos estructurales verificados (mismos booleanos que el duelo). Cero horticultura inventada.
var CATS=[
  {key:"fru", q:"3 de estas 4 te dan <b>fruta</b> para comer. ¿Cuál es la intrusa?", yes:"sí dan fruta", no:"no da fruta comestible"},
  {key:"nat", q:"3 de estas 4 son <b>nativas</b> de Uruguay/la región. ¿Cuál es la exótica?", yes:"son nativas", no:"es exótica (introducida)"},
  {key:"perf", q:"3 de estas 4 son <b>aromáticas / perfumadas</b>. ¿Cuál NO perfuma?", yes:"son aromáticas", no:"no es aromática"},
  {key:"trep", q:"3 de estas 4 son <b>trepadoras</b>. ¿Cuál no trepa?", yes:"son trepadoras", no:"no es trepadora"}
];
function makeRounds(n){
  var cats=shuffle(CATS); var out=[];
  for(var i=0;i<n;i++){
    var c=cats[i%cats.length];
    var yes=shuffle(P.filter(function(p){return p[c.key];})).slice(0,3);
    var noPool=shuffle(P.filter(function(p){return !p[c.key] && yes.indexOf(p)===-1;}));
    var intruder=noPool[0];
    if(yes.length<3 || !intruder){ continue; }
    out.push({cat:c, intruder:intruder, opts:shuffle(yes.concat([intruder]))});
  }
  return out;
}
var R=makeRounds(5), idx=0, score=0, answered=false;
var qel=document.getElementById("q"),opts=document.getElementById("opts"),expl=document.getElementById("expl"),
    nextb=document.getElementById("next"),rmeta=document.getElementById("rmeta"),smeta=document.getElementById("smeta");
function render(){ answered=false; var r=R[idx]; rmeta.textContent="Ronda "+(idx+1)+" de "+R.length; smeta.textContent=score+" ✓";
  qel.innerHTML=r.cat.q; opts.innerHTML="";
  r.opts.forEach(function(o){ var b=document.createElement("button"); b.className="opt"; b.textContent=o.name;
    b.addEventListener("click",function(){ pick(b,o,r); }); opts.appendChild(b); });
  expl.className="expl"; nextb.className="next"; nextb.textContent= idx===R.length-1?"Ver resultado →":"Siguiente →"; }
function pick(btn,o,r){ if(answered)return; answered=true; var ok=o.code===r.intruder.code;
  var bs=opts.querySelectorAll(".opt"); bs.forEach(function(b,i){ b.disabled=true; var isIntr=r.opts[i].code===r.intruder.code;
    if(b===btn){ b.classList.add(ok?"ok":"bad"); } else if(isIntr){ b.classList.add("ok"); } else { b.classList.add("faded"); } });
  if(ok)score++; smeta.textContent=score+" ✓";
  expl.innerHTML=(ok?"✅ ¡Bien! ":"❌ ")+"La intrusa era <b>"+r.intruder.name+"</b> ("+r.intruder.code+"): "+r.cat.no+". Las otras tres "+r.cat.yes+".";
  expl.classList.add("show"); nextb.classList.add("show");
  engageReact("cual-sobra-r"+(idx+1), ok?"correct":"wrong"); }
nextb.addEventListener("click",function(){ if(!answered)return; if(idx<R.length-1){idx++;render();window.scrollTo({top:0,behavior:"smooth"});} else finish(); });
function finish(){ document.getElementById("game").classList.add("hidden"); document.getElementById("end").classList.remove("hidden");
  var sb=document.getElementById("sb"),n=0; var iv=setInterval(function(){n++;sb.textContent=n;if(n>=score)clearInterval(iv);},170); if(score===0)sb.textContent="0";
  document.getElementById("ss").textContent="de "+R.length+" intrusas cazadas"; var p=score/R.length;
  document.getElementById("bd").textContent= p===1?"🏆 ¡Ojo de jardinero!":p>=.6?"🌿 Muy bien":p>=.3?"🌱 Ahí va":"😅 A recorrer el jardín";
  engageReact("cual-sobra-score", score+"/"+R.length); }
render();
</script></body></html>
