<!doctype html>
<!--
PLAN DE INTEGRACIÓN — «Primera luz» como splash real de Jardineando

1. QUÉ SE INYECTA (y qué no): build.py inserta SOLO tres nodos como primeros hijos del
   <body> de cada página generada:
     · el <style data-splash> — 100% scopeado bajo #splash: cero selectores globales,
       cero reset de html/body, keyframes con prefijo jj- para no pisar styles.py.
       Las clases de estado (washing / reveal / finale / notrans) viven en el propio
       div #splash (#splash.washing #wash, etc.), nunca en document.body.
     · el <div id="splash">
     · el <script> del splash
   El botón #again, el footer #foot, el <style data-demo-only> y el CTA "Entrar al
   jardín" son CROMO DE DEMO: NO se inyectan. En la integración real no hay CTA —
   el splash se desmonta solo (remove del DOM) cuando la carga completa y el wash
   termina. Como el HTML del sitio pesa ~13 MB (imágenes base64), el splash — que va
   antes de todo eso — se parsea y pinta al instante mientras el documento sigue llegando.
2. PROGRESO REAL: deja de ser simulado; se mapea a hitos (DOMContentLoaded ≈ 60%,
   decodificación de imágenes ≈ 90%, window.load = 100%), manteniendo la vacilación
   estética si la carga real es más rápida.
3. Exhibición mínima de 1.4 s: aunque window.load llegue antes, el amanecer completa
   su arco; después el wash a crema y remove del DOM.
4. sessionStorage.jardineando_splash_v1 = "1" al primer show: en navegaciones internas
   de la misma sesión el splash no se monta.
5. TIPOGRAFÍA: el título usa font-family:'Anton',Georgia,serif. El sitio ya carga Anton
   (styles.py), así que integrado el settle final aterriza en la voz tipográfica de la
   marca. En esta demo standalone Georgia es fallback DELIBERADO: la spec exige cero
   requests externos, así que no se importa la fuente acá.
6. Cero dependencias nuevas: system fonts + Anton heredada, SVG inline, sin fetch —
   respeta el requisito offline. prefers-reduced-motion contemplado.
-->
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Jardineando — Primera luz</title>
<style data-splash>
#splash{
  --verde:#2d5016; --verde2:#4a7c2a; --crema:#f5faf0;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:'Anton',Georgia,"Times New Roman",serif;
  position:fixed;inset:0;overflow:hidden;background:#050816;user-select:none;-webkit-user-select:none;
  font-family:var(--sans);-webkit-tap-highlight-color:transparent;animation:jj-fadein .7s ease-out both
}
#splash,#splash *{margin:0;padding:0;box-sizing:border-box}
@keyframes jj-fadein{from{opacity:0}to{opacity:1}}

/* ——— cielo: 6 capas de gradiente precalculadas, crossfade de opacity (compositor-only,
       cero repaint full-screen por frame) ——— */
#splash #sky{position:absolute;inset:0;z-index:1}
#splash .skyg{position:absolute;inset:0;will-change:opacity}
#splash .skyg+.skyg{opacity:0}
#splash .skyg:nth-child(1){background:linear-gradient(180deg,#050816 0%,#0a1030 36%,#101a44 62%,#182252 100%)}
#splash .skyg:nth-child(2){background:linear-gradient(180deg,#070a20 0%,#12143c 36%,#241e54 62%,#3a2a5e 100%)}
#splash .skyg:nth-child(3){background:linear-gradient(180deg,#0c1030 0%,#231b4e 36%,#4a2c62 62%,#7c4160 100%)}
#splash .skyg:nth-child(4){background:linear-gradient(180deg,#1b2148 0%,#463366 36%,#8a4a6e 62%,#c96952 100%)}
#splash .skyg:nth-child(5){background:linear-gradient(180deg,#3d4a7e 0%,#7e5f8e 36%,#c97a6a 62%,#f0994e 100%)}
#splash .skyg:nth-child(6){background:linear-gradient(180deg,#7e97b8 0%,#c2a9a2 36%,#f0bc80 62%,#ffd98f 100%)}

#splash #stars{position:absolute;inset:0;z-index:2;pointer-events:none}
#splash .st{position:absolute;will-change:opacity}
#splash .stc{display:block;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.45);animation:jj-tw ease-in-out infinite alternate}
#splash .lucero .stc{box-shadow:0 0 12px 3px rgba(255,236,200,.75);background:#fff6e2}
@keyframes jj-tw{from{opacity:.35}to{opacity:1}}

/* glow de horizonte: más ancho que alto — luz que barre horizontal, sostenida hasta p=1 */
#splash #glowH{position:absolute;left:0;right:0;bottom:8vh;height:44vh;z-index:3;background:radial-gradient(ellipse 155% 100% at 50% 100%,rgba(255,148,72,.55),rgba(255,120,90,.2) 45%,transparent 70%);opacity:0;will-change:opacity;pointer-events:none}
#splash #sunW{position:absolute;left:0;top:0;z-index:4;will-change:transform;pointer-events:none}
/* halo elíptico (scaleX 1.6 en JS): amanecer rasante, no cenital */
#splash #halo{position:absolute;left:0;top:0;width:240px;height:240px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,190,110,.5),rgba(255,150,80,.18) 45%,transparent 70%)}
#splash #sun{position:absolute;left:0;top:0;width:clamp(56px,17vw,84px);height:clamp(56px,17vw,84px);transform:translate(-50%,-50%);border-radius:50%}

/* ——— remate: wash de primera luz — origen en la posición FINAL del sol (53% / 60vh) ——— */
#splash #wash{position:absolute;inset:0;z-index:6;background:radial-gradient(circle at 53% 60%,#fff6dc 0%,#f8f9ec 34%,var(--crema) 62%);clip-path:circle(0% at 53% 60%);transition:clip-path 1.05s cubic-bezier(.66,0,.22,1);pointer-events:none}
#splash.washing #wash{clip-path:circle(142% at 53% 60%)}

/* ——— pájaros: POR ENCIMA del wash (z7) para que completen el cruce mientras la luz abre ——— */
#splash #birds{position:absolute;left:0;top:22vh;width:100%;height:20vh;z-index:7;pointer-events:none}
#splash .bird{position:absolute;left:0;top:0;opacity:0;color:#362a4e}
#splash .bird svg{width:22px;height:10px;display:block}
#splash .b1{--s:1;top:2vh}
#splash .b2{--s:.68;top:7.5vh}
#splash .b3{--s:.85;top:0}
#splash #birds.go .b1{animation:jj-cross 2.35s cubic-bezier(.33,.12,.55,.9) 0s forwards}
#splash #birds.go .b2{animation:jj-cross 2.5s cubic-bezier(.33,.12,.55,.9) .28s forwards}
#splash #birds.go .b3{animation:jj-cross 2.42s cubic-bezier(.33,.12,.55,.9) .5s forwards}
#splash #birds.go svg{animation:jj-flap .48s ease-in-out infinite;transform-origin:50% 40%}
@keyframes jj-cross{0%{opacity:0;transform:translate(-9vw,3vh) scale(var(--s))}8%{opacity:.9}90%{opacity:.9}100%{opacity:0;transform:translate(106vw,-3.5vh) scale(var(--s))}}
@keyframes jj-flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}

/* ——— jardín en capas ——— */
#splash .layer{position:absolute;inset:0;will-change:transform;pointer-events:none}
#splash #lfar{z-index:8}#splash #lmid{z-index:10}#splash #lnear{z-index:11}
#splash .band{position:absolute;left:0;bottom:-40px;width:100%}
#splash #lfar .band{height:calc(21vh + 40px)}
#splash #lmid .band{height:calc(14vh + 40px)}
#splash #lnear .band{height:calc(8.5vh + 40px)}
#splash .tr{position:absolute;display:block}
#splash .dt{display:none}
#splash #fog{position:absolute;left:-10%;width:120%;height:13vh;bottom:14vh;z-index:9;background:linear-gradient(180deg,transparent,rgba(216,226,242,.55) 45%,rgba(216,226,242,.12) 82%,transparent);filter:blur(7px);opacity:0;animation:jj-drift 8s ease-in-out infinite alternate;pointer-events:none}
@keyframes jj-drift{from{transform:translateX(-2.5%)}to{transform:translateX(2.5%)}}
#splash #vig{position:absolute;inset:0;z-index:12;background:radial-gradient(ellipse 120% 90% at 50% 48%,transparent 55%,rgba(3,5,16,.55) 100%);will-change:opacity;pointer-events:none}

/* ——— HUD: % en pill siempre legible (fondo oscuro + blur → contraste ≥4.5:1
       incluso sobre el centro del halo) ——— */
#splash #pctW{position:absolute;left:0;top:0;z-index:13;opacity:0;pointer-events:none;will-change:transform,opacity}
#splash #pctW .in{position:absolute;left:46px;top:0;transform:translateY(-50%);font:500 12px/1 var(--sans);letter-spacing:.14em;font-variant-numeric:tabular-nums;color:#faf4e8;background:rgba(5,8,22,.62);padding:6px 9px 6px 12px;border-radius:999px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);white-space:nowrap}
#splash #copy{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:13;text-align:center;padding:0 28px;font:400 14.5px/1.45 var(--sans);letter-spacing:.01em;color:rgba(247,242,231,.9);text-shadow:0 1px 6px rgba(5,8,20,.5);transition:opacity .24s ease}
#splash.washing #pctW,#splash.washing #copy{opacity:0!important;transition:opacity .4s ease}

/* ——— pantalla final: el dotsun ANCLA en la posición final del sol y se encoge
       (scale var(--k)→1) sincronizado con el wash — continuidad del protagonista ——— */
#splash #final{position:absolute;inset:0;z-index:14;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(60vh + 18px) 24px 0;text-align:center;visibility:hidden}
#splash.reveal #final{visibility:visible}
#splash .dotsun{--k:6.6;position:absolute;left:53%;top:60%;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe9b8,#e8a13c);box-shadow:0 0 18px 5px rgba(240,170,80,.35);opacity:0;transform:translate(-50%,-50%) scale(var(--k));transition:opacity .5s ease,transform 1.05s cubic-bezier(.34,1.56,.64,1)}
#splash .title{margin-top:0;font:400 clamp(34px,9.5vw,46px)/1.1 var(--serif);color:var(--verde);letter-spacing:.13em;opacity:0;transform:translateY(14px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.16,.8,.24,1),letter-spacing 1.15s cubic-bezier(.2,.7,.2,1)}
#splash .sub{margin-top:10px;font:600 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#4a5f3d;opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .8s cubic-bezier(.16,.8,.24,1)}
#splash .cta{display:inline-flex;align-items:center;gap:9px;margin-top:24px;padding:13px 26px;border-radius:999px;background:var(--verde);color:var(--crema);text-decoration:none;font:600 15px/1 var(--sans);letter-spacing:.02em;box-shadow:0 10px 24px -8px rgba(45,80,22,.45);opacity:0;transform:translateY(12px);transition:opacity .7s ease,transform .8s cubic-bezier(.16,.8,.24,1),box-shadow .3s ease}
#splash .cta i{font-style:normal;display:inline-block;transition:transform .3s cubic-bezier(.2,.8,.3,1.4)}
#splash .cta:hover i{transform:translateX(4px)}
#splash .cta:hover{box-shadow:0 14px 30px -8px rgba(45,80,22,.55)}
#splash .cta:focus-visible{outline:3px solid var(--verde2);outline-offset:3px}
#splash.reveal .dotsun{opacity:1;transform:translate(-50%,-50%) scale(1)}
#splash.reveal .title{opacity:1;transform:none;letter-spacing:.02em;transition-delay:.35s}
#splash.reveal .sub{opacity:1;transform:none;transition-delay:.52s}
#splash.reveal .cta{opacity:1;transform:translateY(0);transition-delay:.7s}

#splash.notrans,#splash.notrans *{transition:none!important}

@media (min-width:500px){
  #splash .dotsun{--k:8.4}
}
@media (min-width:760px){
  #splash .dt{display:block}
  #splash #pctW .in{left:58px}
}

/* ——— reduced motion: crossfades suaves, cero desplazamiento; el sol queda fijo en su
       posición final (53vw/60vh) y el % baja a debajo del disco, fuera del halo ——— */
@media (prefers-reduced-motion: reduce){
  #splash .stc,#splash #birds.go svg,#splash #fog{animation:none!important}
  #splash .bird{animation:none!important;opacity:0!important}
  #splash #wash{clip-path:none!important;opacity:0;transition:opacity .95s ease}
  #splash.washing #wash{opacity:1}
  #splash .dotsun{transform:translate(-50%,-50%)!important;transition:opacity .8s ease!important}
  #splash .title,#splash .sub,#splash .cta{transform:none!important;transition:opacity .8s ease!important}
  #splash .title{letter-spacing:.02em!important}
  #splash #pctW .in{left:0;top:48px;transform:translateX(-50%)}
}
</style>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const splash=$('splash');
const sunW=$('sunW'),sun=$('sun'),halo=$('halo'),glowH=$('glowH'),
      fog=$('fog'),vig=$('vig'),starBox=$('stars'),birds=$('birds'),
      pctW=$('pctW'),pct=$('pct'),copy=$('copy'),
      lfar=$('lfar'),lmid=$('lmid'),lnear=$('lnear');
const skyg=Array.prototype.slice.call(document.querySelectorAll('#sky .skyg'));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR=4800;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
const lerp=(a,b,t)=>a+(b-a)*t;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;

/* Progreso no lineal: ~0.7s de noche cerrada y quieta (solo estrellas), arranque
   decidido, vacilación real al 76–79%, remate */
const KEYS=[[0,0],[.14,.05],[.3,.38],[.48,.62],[.58,.72],[.66,.76],[.8,.79],[.88,.9],[1,1]];
function curve(u){
  if(u>=1)return 1;
  for(let i=1;i<KEYS.length;i++){
    if(u<=KEYS[i][0]){
      const a=KEYS[i-1],b=KEYS[i],k=(u-a[0])/(b[0]-a[0]);
      return a[1]+(b[1]-a[1])*(k*k*(3-2*k));
    }
  }
  return 1;
}

/* Cielo: crossfade entre las capas precalculadas del CSS (índices = SKYK) */
const SKYK=[0,.22,.45,.65,.82,1];
function skyRender(p){
  let i=1;while(i<SKYK.length-1&&p>SKYK[i])i++;
  const k=clamp((p-SKYK[i-1])/(SKYK[i]-SKYK[i-1]),0,1);
  for(let j=1;j<skyg.length;j++)skyg[j].style.opacity=j<i?'1':j===i?k.toFixed(3):'0';
}

/* Capas: de negro-azul nocturno a violeta del alba; al remate, verdes de la marca */
const LAY={
  far:{el:lfar,n:hx('#0a0e22'),d:hx('#3b3355'),f:hx('#c1d3aa')},
  mid:{el:lmid,n:hx('#070a19'),d:hx('#211f3a'),f:hx('#87a765')},
  near:{el:lnear,n:hx('#04060f'),d:hx('#131320'),f:hx('#2d5016')}
};
const SUNA=hx('#ff7a3a'),SUNB=hx('#ffedc2');

/* 4 mensajes a ~1.2s cada uno: hay tiempo físico de leer el díptico del caqui */
const COPY=['Abriendo el portón del fondo…',
'Contando las 52 especies…',
'Buscando fruta en el presunto caqui…',
'El caqui sigue sin dar. Amanece igual.'];
const CT=[0,1200,2400,3600];

let stars=[],raf=0,fraf=0,t0=0,ci=0,fc=0,birdsGo=false,copyTimer=0,finTimers=[];

function buildStars(){
  starBox.textContent='';stars=[];
  const frag=document.createDocumentFragment();
  for(let i=0;i<46;i++){
    const o=document.createElement('div');o.className='st';
    const r=Math.random(),sz=r>.86?2.6:r>.5?1.8:1.2;
    o.style.left=(Math.random()*100).toFixed(2)+'%';
    o.style.top=(Math.random()*56).toFixed(2)+'%';
    const c=document.createElement('i');c.className='stc';
    c.style.width=c.style.height=sz+'px';
    c.style.animationDuration=(2.2+Math.random()*2.8).toFixed(2)+'s';
    c.style.animationDelay=(-Math.random()*4).toFixed(2)+'s';
    o.appendChild(c);frag.appendChild(o);
    stars.push({el:o,th:.16+Math.random()*.5});
  }
  /* El lucero del alba: se apaga último */
  const o=document.createElement('div');o.className='st lucero';
  o.style.left='27%';o.style.top='15%';
  const c=document.createElement('i');c.className='stc';
  c.style.width=c.style.height='3.5px';c.style.animationDuration='3.8s';
  o.appendChild(c);frag.appendChild(o);
  stars.push({el:o,th:.8});
  starBox.appendChild(frag);
}

/* full=false saltea lo que nadie nota a 20Hz (color del sol, capas, estrellas);
   transform del sol y crossfade del cielo corren a 60fps */
function render(p,full){
  skyRender(p);
  /* techo del sol en 60vh: sol bajo de julio a 34.9°S, luz rasante — no cenital */
  const sx=reduced?53:lerp(46,53,p);
  const sy=reduced?60:lerp(96,60,p);
  sunW.style.transform=`translate3d(${sx.toFixed(3)}vw,${sy.toFixed(3)}vh,0)`;
  pctW.style.transform=`translate3d(${sx.toFixed(3)}vw,${sy.toFixed(3)}vh,0)`;
  /* el % nace con el sol al asomar sobre las siluetas — la noche abre limpia,
     sin HUD flotando sobre el copy; en reduced-motion queda visible siempre */
  pctW.style.opacity=reduced?'1':ss(.22,.36,p).toFixed(3);
  const hs=.7+.9*p;
  halo.style.opacity=(.3+.6*p).toFixed(3);
  halo.style.transform=`translate(-50%,-50%) scale(${(hs*1.6).toFixed(3)},${hs.toFixed(3)})`;
  glowH.style.opacity=(.95*ss(.05,.55,p)).toFixed(3);
  fog.style.opacity=(.55*ss(.04,.3,p)*(1-ss(.5,.78,p))).toFixed(3);
  vig.style.opacity=((1-p)*.65).toFixed(3);
  if(!reduced){
    lfar.style.transform=`translate3d(0,${((1-p)*9).toFixed(2)}px,0)`;
    lmid.style.transform=`translate3d(0,${((1-p)*20).toFixed(2)}px,0)`;
    lnear.style.transform=`translate3d(0,${((1-p)*34).toFixed(2)}px,0)`;
  }
  if(full){
    const sc=mix(SUNA,SUNB,ss(.15,.9,p));
    sun.style.background=`radial-gradient(circle at 38% 32%,#fff8e6,${rgb(sc)} 72%)`;
    sun.style.boxShadow=`0 0 ${(24+70*p).toFixed(1)}px ${(10+16*p).toFixed(1)}px rgba(255,168,88,${(.26+.34*p).toFixed(3)})`;
    for(const key in LAY){
      const L=LAY[key];
      L.el.style.color=rgb(mix(L.n,L.d,ss(.25,.95,p)));
    }
    for(const st of stars){
      st.el.style.opacity=(1-ss(st.th-.06,st.th+.03,p)).toFixed(3);
    }
  }
  const n=Math.round(p*100);
  pct.textContent=n;
  pctW.setAttribute('aria-valuenow',n);
  /* pájaros: disparo temprano (p≥.6 ≈ 2.1s) + cruce de 2.35–2.5s + z-index sobre el
     wash → los tres completan el cruce, el último sale mientras la luz abre */
  if(!reduced&&!birdsGo&&p>=.6){birdsGo=true;birds.classList.add('go');}
}

function frame(now){
  if(!t0)t0=now;
  const t=now-t0,u=Math.min(t/DUR,1),p=curve(u);
  if(ci<COPY.length-1&&t>=CT[ci+1]){
    ci++;
    const txt=COPY[ci];
    clearTimeout(copyTimer);
    copy.style.opacity=0;
    copyTimer=setTimeout(()=>{copy.textContent=txt;copy.style.opacity=1},230);
  }
  render(p,fc%3===0||u>=1);fc++;
  if(u<1)raf=requestAnimationFrame(frame);
  else finale();
}

function finale(){
  finTimers.push(setTimeout(()=>{
    splash.classList.add('washing');
    const f0=performance.now(),D=1150;
    (function step(){
      const k=Math.min(1,(performance.now()-f0)/D);
      const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      for(const key in LAY){
        const L=LAY[key];
        L.el.style.color=rgb(mix(L.d,L.f,e));
      }
      if(k<1)fraf=requestAnimationFrame(step);
    })();
  },180));
  /* reveal temprano: el dotsun aparece grande donde estaba el sol (el wash ya cubrió
     ese centro) y se encoge con spring mientras el wash termina de abrir */
  finTimers.push(setTimeout(()=>{splash.classList.add('reveal');},620));
  finTimers.push(setTimeout(()=>{splash.classList.add('finale');},1250));
}

function reset(){
  cancelAnimationFrame(raf);cancelAnimationFrame(fraf);
  clearTimeout(copyTimer);finTimers.forEach(clearTimeout);finTimers=[];
  splash.classList.add('notrans');
  splash.classList.remove('washing','reveal','finale');
  birds.classList.remove('go');
  birdsGo=false;ci=0;t0=0;fc=0;
  copy.textContent=COPY[0];copy.style.opacity=1;
  buildStars();
  render(0,true);
  setTimeout(()=>{
    splash.classList.remove('notrans');
    raf=requestAnimationFrame(frame);
  },80);
}

$('again').addEventListener('click',reset);
buildStars();
render(0,true);
raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
