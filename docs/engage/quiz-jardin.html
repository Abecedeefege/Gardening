<!DOCTYPE html>
<html lang="es-UY"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a0a"><title>¿Cuánto conocés tu jardín? · Jardineando</title>
<style>
  :root{ --verde:#2d5016; --verde2:#5a9e35; --crema:#f6f4ea; --tinta:#1a2410; --ok:#3f9142; --mal:#c0392b; --pad:max(18px,env(safe-area-inset-left)); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:radial-gradient(130% 90% at 50% 0%, #fbfaf3, #eaecdd); color:var(--tinta);
    -webkit-font-smoothing:antialiased; padding:0 var(--pad) calc(40px + env(safe-area-inset-bottom)); }
  .top{ padding:calc(14px + env(safe-area-inset-top)) 0 6px; } .top a{ color:var(--verde); text-decoration:none; font-size:14px; font-weight:700; }
  h1{ font-size:clamp(22px,6.2vw,28px); letter-spacing:-0.02em; color:var(--verde); margin:8px 0 2px; }
  .bar{ height:6px; background:#e2e7d6; border-radius:99px; overflow:hidden; margin:12px 0 4px; }
  .bar > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--verde2),var(--verde)); transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .meta{ display:flex; justify-content:space-between; font-size:12.5px; color:#7a8a68; font-weight:700; }
  .card{ max-width:560px; margin:14px auto 0; }
  .qn{ font-size:13px; color:var(--verde2); font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
  .q{ font-size:clamp(19px,5vw,23px); font-weight:800; color:var(--tinta); line-height:1.25; margin:6px 0 16px; }
  .opt{ display:block; width:100%; text-align:left; background:#fff; border:1.5px solid #e2e7d6; border-radius:14px;
    padding:15px 16px; margin:9px 0; font-size:15.5px; font-weight:600; color:var(--tinta); cursor:pointer;
    transition:transform .12s, border-color .2s, background .2s, box-shadow .2s; box-shadow:0 1px 3px rgba(45,80,22,.05); }
  .opt:active{ transform:scale(.985); } .opt:disabled{ cursor:default; }
  .opt.ok{ border-color:var(--ok); background:#eef7ee; animation:pop .35s; }
  .opt.bad{ border-color:var(--mal); background:#fbecea; animation:shake .4s; }
  .opt.faded{ opacity:.5; }
  @keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.04)} 100%{transform:scale(1)} }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .expl{ max-width:560px; margin:8px auto 0; background:#eef3e5; border-radius:12px; padding:13px 15px; font-size:14px;
    color:#3c4a30; line-height:1.5; opacity:0; transform:translateY(8px); }
  .expl.show{ opacity:1; transform:none; transition:.35s; }
  .expl b{ color:var(--verde); }
  .next{ display:block; width:100%; max-width:560px; margin:16px auto 0; padding:15px; border:none; border-radius:14px;
    background:var(--verde); color:#fff; font-size:16px; font-weight:800; cursor:pointer; opacity:0; pointer-events:none; transition:.3s; }
  .next.show{ opacity:1; pointer-events:auto; }
  /* Final */
  .final{ max-width:560px; margin:30px auto 0; text-align:center; }
  .scorebig{ font-size:64px; font-weight:800; color:var(--verde); line-height:1; }
  .scoresub{ font-size:16px; color:#5a6b4a; margin-top:6px; }
  .ring{ width:150px; height:150px; margin:6px auto 10px; }
  .ring circle{ fill:none; stroke-width:13; }
  .ring .bg{ stroke:#e2e7d6; } .ring .fg{ stroke:var(--verde2); stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); transform:rotate(-90deg); transform-origin:center; }
  .badge{ font-size:20px; font-weight:800; color:var(--verde); margin:4px 0 2px; }
  .replay{ margin-top:18px; display:flex; gap:10px; flex-direction:column; }
  .replay button{ padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:800; cursor:pointer; }
  .replay .again{ background:var(--verde); color:#fff; } .replay .home{ background:#fff; color:#5a6b4a; border:1px solid #d7e0c9; }
  .hidden{ display:none; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style></head><body>
<div class="top"><a href="https://gardening-chi.vercel.app/index.html">← Inicio</a>
  <h1>🧠 ¿Cuánto conocés tu jardín?</h1>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="meta"><span id="qmeta">Pregunta 1</span><span id="smeta">0 ✓</span></div>

<div id="game">
  <div class="card">
    <div class="qn" id="qn"></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
  </div>
  <div class="expl" id="expl"></div>
  <button class="next" id="next">Siguiente →</button>
</div>

<div id="end" class="final hidden">
  <svg class="ring" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ring" cx="60" cy="60" r="52"/></svg>
  <div class="scorebig" id="scorebig">0</div>
  <div class="scoresub" id="scoresub"></div>
  <div class="badge" id="badge"></div>
  <div class="replay">
    <button class="again" onclick="location.hash='#set='+(SET%4+1); location.reload();">🔄 Otra ronda (preguntas nuevas)</button>
    <button class="home" onclick="location.href='https://gardening-chi.vercel.app/index.html#curiosidades'">Ver curiosidades →</button>
  </div>
</div>

<script src="engage.js"></script>
<script>
  var POOL = [
    {q:"¿Cuál de estas plantas tuyas es NATIVA del Uruguay?", o:[["Guayabo del país",1],["Limonero",0],["Hibisco",0],["Durazno",0]],
     e:"El guayabo (feijoa, <i>Acca sellowiana</i>) es nativo del sur de Brasil y Uruguay. Los cítricos, el hibisco y el durazno son todos exóticos."},
    {q:"¿De cuántos árboles descienden TODAS las paltas Hass del mundo?", o:[["De uno solo",1],["De cien",0],["De miles",0],["De veintiséis",0]],
     e:"De <b>un único árbol</b> que Rudolph Hass plantó en California en 1926. Cada Hass del planeta es un injerto-clon de aquel."},
    {q:"¿Cuál de tus plantas tiene pétalos comestibles y dulces?", o:[["El guayabo",1],["El liquidámbar",0],["El pitósporo",0],["El fresno",0]],
     e:"Los pétalos del guayabo saben a <b>algodón de azúcar</b>; los chicos los comían como golosina."},
    {q:"¿En qué mes tu jardín tiene MÁS plantas en flor a la vez?", o:[["Noviembre",1],["Junio",0],["Marzo",0],["Agosto",0]],
     e:"En <b>noviembre</b> (plena primavera) tenés 32 plantas en flor a la vez. Junio, en pleno invierno, solo 1."},
    {q:"¿Cuál de estos NO existe en estado silvestre (es un híbrido inventado)?", o:[["El limón",1],["El durazno",0],["El caqui",0],["La palta",0]],
     e:"El <b>limón</b> es un híbrido de cidro × naranja amarga creado hace ~2500 años. No hay limoneros silvestres."},
    {q:"¿Por qué la lantana cambia de color (amarillo → rojo)?", o:[["Para avisar a los insectos qué flores ya polinizó",1],["Por el frío",0],["Por falta de agua",0],["Por la edad de la planta",0]],
     e:"Es un <b>semáforo</b>: los polinizadores van al amarillo (flor fresca) y evitan el rojo (ya polinizada)."},
    {q:"'Diospyros', nombre griego de una de tus plantas, significa 'fruta de los dioses'. ¿Cuál es?", o:[["El caqui",1],["La pera",0],["El ciruelo",0],["La mandarina",0]],
     e:"El <b>caqui</b> (<i>Diospyros</i>). En Japón es símbolo de longevidad: hay caquis de 600 años todavía dando fruta."},
    {q:"El nombre 'romero' viene del latín 'ros marinus'. ¿Qué significa?", o:[["Rocío del mar",1],["Rey del monte",0],["Flor del sur",0],["Hierba santa",0]],
     e:"<b>Rocío del mar</b> — crece en acantilados con la humedad marina. Bonus: oler romero mejora la memoria (estudio de Northumbria)."},
    {q:"Tu hibisco (rosa china) es la flor nacional de…", o:[["Malasia",1],["Brasil",0],["Uruguay",0],["Japón",0]],
     e:"De <b>Malasia</b> desde 1960 — la llaman <i>Bunga Raya</i>. Cada flor dura un solo día."},
    {q:"El durazno se llama 'persica' (de Persia), pero en realidad es originario de…", o:[["China",1],["Persia",0],["Italia",0],["México",0]],
     e:"De <b>China</b>, con carozos arqueológicos de hace 8000 años. Llegó a Europa vía Persia y le quedó el nombre."}
  ];

  function getSet(){ var m=(location.hash.match(/set=(\d+)/)||[])[1]; return m?Math.max(1,Math.min(4,+m)):1; }
  var SET=getSet();
  // 5 preguntas por ronda, ventana rotada por set (cada set = preguntas distintas)
  var off=(SET-1)*3 % POOL.length;
  var Q=[]; for(var i=0;i<5;i++) Q.push(POOL[(off+i)%POOL.length]);
  // barajar opciones de cada pregunta
  Q=Q.map(function(it){ var o=it.o.slice(); for(var i=o.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=o[i];o[i]=o[j];o[j]=t;} return {q:it.q,o:o,e:it.e}; });

  var idx=0, score=0, answered=false;
  var qn=document.getElementById('qn'), qtext=document.getElementById('qtext'), opts=document.getElementById('opts'),
      expl=document.getElementById('expl'), nextb=document.getElementById('next'), bar=document.getElementById('bar'),
      qmeta=document.getElementById('qmeta'), smeta=document.getElementById('smeta');

  function render(){
    answered=false; var it=Q[idx];
    qn.textContent='Pregunta '+(idx+1)+' de '+Q.length;
    qtext.textContent=it.q; opts.innerHTML='';
    qmeta.textContent='Pregunta '+(idx+1); smeta.textContent=score+' ✓';
    bar.style.width=((idx)/Q.length*100)+'%';
    it.o.forEach(function(op){
      var b=document.createElement('button'); b.className='opt'; b.textContent=op[0];
      b.addEventListener('click', function(){ pick(b, op[1], it); });
      opts.appendChild(b);
    });
    expl.className='expl'; expl.innerHTML=''; nextb.className='next';
    nextb.textContent = idx===Q.length-1 ? 'Ver resultado →' : 'Siguiente →';
  }
  function pick(btn, isOk, it){
    if(answered) return; answered=true;
    var all=opts.querySelectorAll('.opt');
    all.forEach(function(b){ b.disabled=true;
      var correct = it.o[Array.prototype.indexOf.call(all,b)][1]===1;
      if(b===btn){ b.classList.add(isOk?'ok':'bad'); }
      else if(correct){ b.classList.add('ok'); } else { b.classList.add('faded'); }
    });
    if(isOk){ score++; smeta.textContent=score+' ✓'; }
    expl.innerHTML=(isOk?'✅ ¡Bien! ':'❌ ')+it.e; expl.classList.add('show');
    bar.style.width=((idx+1)/Q.length*100)+'%';
    nextb.classList.add('show');
    engageReact('quiz-set'+SET+'-q'+(idx+1), isOk?'correct':'wrong');
  }
  nextb.addEventListener('click', function(){
    if(!answered) return;
    if(idx<Q.length-1){ idx++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    else finish();
  });
  function finish(){
    document.getElementById('game').classList.add('hidden');
    var end=document.getElementById('end'); end.classList.remove('hidden');
    var pct=score/Q.length;
    var ring=document.getElementById('ring'), C=2*Math.PI*52; ring.style.strokeDasharray=C; ring.style.strokeDashoffset=C;
    setTimeout(function(){ ring.style.strokeDashoffset=C*(1-pct); }, 100);
    var sb=document.getElementById('scorebig'), n=0;
    var iv=setInterval(function(){ n++; sb.textContent=n; if(n>=score) clearInterval(iv); }, 180);
    if(score===0) sb.textContent='0';
    document.getElementById('scoresub').textContent='de '+Q.length+' correctas';
    var badge = pct===1?'🏆 ¡Maestro jardinero!' : pct>=0.6?'🌿 Conocés bien tu jardín' : pct>=0.3?'🌱 Vas aprendiendo' : '😅 Hay jardín para descubrir';
    document.getElementById('badge').textContent=badge;
    engageReact('quiz-set'+SET+'-score', score+'/'+Q.length);
  }
  render();
</script>
</body></html>
