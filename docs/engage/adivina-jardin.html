<style>

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; }

    -webkit-font-smoothing:antialiased; padding:0 var(--pad) calc(40px + env(safe-area-inset-bottom)); }
  .top{ padding:calc(14px + env(safe-area-inset-top)) 0 6px; } .top a{ color:var(--verde); text-decoration:none; font-size:14px; font-weight:700; }

  .expl{ max-width:540px; margin:12px auto 0; background:#eef3e5; border-radius:12px; padding:13px 15px; font-size:14px; color:#3c4a30; line-height:1.5; opacity:0; transform:translateY(8px); }
  .expl.show{ opacity:1; transform:none; transition:.35s; } .expl b{ color:var(--verde); }
  .next{ display:block; width:100%; max-width:540px; margin:16px auto 0; padding:15px; border:none; border-radius:14px; background:var(--verde); color:#fff; font-size:16px; font-weight:800; cursor:pointer; opacity:0; pointer-events:none; transition:.3s; }
  .next.show{ opacity:1; pointer-events:auto; }
  .final{ max-width:540px; margin:34px auto 0; text-align:center; } .scorebig{ font-size:60px; font-weight:800; color:var(--verde); line-height:1; }
  .scoresub{ font-size:16px; color:#5a6b4a; } .badge{ font-size:20px; font-weight:800; color:var(--verde); margin:10px 0; }
  .replay{ margin-top:14px; display:flex; flex-direction:column; gap:10px; } .replay button{ padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:800; cursor:pointer; }
  .replay .again{ background:var(--verde); color:#fff; } .replay .home{ background:#fff; color:#5a6b4a; border:1px solid #d7e0c9; } .hidden{ display:none; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

  .clue{ max-width:540px; margin:16px auto 0; background:#fff; border:1px solid #e2e7d6; border-radius:14px; padding:16px; font-size:15.5px; color:#3c4a30; line-height:1.5; box-shadow:0 1px 3px rgba(45,80,22,.05); min-height:54px; }
  .clue b{ color:var(--verde); }
  .opts{ max-width:540px; margin:14px auto 0; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt{ background:#fff; border:1.5px solid #e2e7d6; border-radius:14px; padding:15px 12px; font-size:15px; font-weight:700; color:var(--tinta); cursor:pointer; transition:transform .12s, border-color .2s, background .2s; }
  .opt:active{ transform:scale(.97); } .opt:disabled{ cursor:default; } .opt.ok{ border-color:var(--ok); background:#eef7ee; } .opt.bad{ border-color:var(--mal); background:#fbecea; } .opt.faded{ opacity:.5; }
</style></head><body>
<div class="top"><a href="https://gardening-chi.vercel.app/index.html">← Inicio</a><h1>🔍 Adiviná la planta</h1></div>

"code": "B-30", "name": "Durazno", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-32", "name": "Viraró", "zone": "fondo", "nat": true, "fru": false, "perf": false, "trep": false}, {"code": "B-34", "name": "Mandioca brava (tentativa)", "zone": "fondo", "nat": true, "fru": false, "perf": false, "trep": false}, {"code": "B-36", "name": "Palta Haas", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-37", "name": "Liquidámbar", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-38", "name": "Ciruela amarilla", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-39", "name": "Pera Williams", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-40", "name": "Madreselva china siempreverde", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-41", "name": "Caqui / Persimón", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-42", "name": "Pata de vaca", "zone": "fondo", "nat": true, "fru": false, "perf": false, "trep": false}, {"code": "B-43", "name": "Pitósporo", "zone": "fondo", "nat": false, "fru": false, "perf": true, "trep": false}, {"code": "B-44", "name": "Evónimo japonés variegado", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-45", "name": "Sin identificar (al lado de la pared, atrás de B-35)", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": true}, {"code": "B-46", "name": "Vivero / Plantines", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-48", "name": "Plantín de roble joven (Quercus sp.)", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-49", "name": "Plantín trifoliado (posible glicinia o leguminosa)", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-47", "name": "Plantines de palmera (lote separado)", "zone": "fondo", "nat": true, "fru": false, "perf": false, "trep": false}, {"code": "I-1", "name": "Singonio / Pata de gallo", "zone": "interior", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "I-2", "name": "Difenbaquia / Caña muda", "zone": "interior", "nat": false, "fru": false, "perf": false, "trep": false}];
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
var ZN={fondo:'el fondo (sale el sol, sol de mañana)',frente:'el frente (se oculta el sol, sol de tarde)',interior:'el interior de casa'};
function clueFor(p){ var c=[]; c.push('Vive en <b>'+(ZN[p.zone]||p.zone)+'</b>.');
  if(p.nat) c.push('Es <b>nativa</b> del Uruguay/región.'); else c.push('Es una especie <b>exótica</b> (introducida).');
  if(p.fru) c.push('Te da <b>fruta</b> para comer.'); if(p.perf) c.push('Es <b>aromática / perfumada</b>.'); if(p.trep) c.push('Es <b>trepadora</b>.');
  return c; }
// rondas: una planta objetivo + 3 distractores
function makeRounds(n){ var pool=shuffle(P).slice(0, n+2); var out=[];
  for(var i=0;i<n;i++){ var target=pool[i]; var others=shuffle(P.filter(function(x){return x.code!==target.code;})).slice(0,3);
    var opts=shuffle([target].concat(others)); out.push({t:target, opts:opts, clues:clueFor(target)}); } return out; }
var R=makeRounds(5), idx=0, score=0, answered=false;
var clue=document.getElementById('clue'),opts=document.getElementById('opts'),expl=document.getElementById('expl'),
    nextb=document.getElementById('next'),rmeta=document.getElementById('rmeta'),smeta=document.getElementById('smeta');
function render(){ answered=false; var r=R[idx]; rmeta.textContent='Ronda '+(idx+1)+' de '+R.length; smeta.textContent=score+' ✓';
  clue.innerHTML='🔎 '+r.clues.slice(0,2).join(' '); opts.innerHTML='';
  r.opts.forEach(function(o){ var b=document.createElement('button'); b.className='opt'; b.textContent=o.name;
    b.addEventListener('click',function(){ pick(b,o,r); }); opts.appendChild(b); });
  expl.className='expl'; nextb.className='next'; nextb.textContent= idx===R.length-1?'Ver resultado →':'Siguiente →'; }
function pick(btn,o,r){ if(answered)return; answered=true; var ok=o.code===r.t.code;
  var bs=opts.querySelectorAll('.opt'); bs.forEach(function(b,i){ b.disabled=true; var isT=r.opts[i].code===r.t.code;
    if(b===btn){ b.classList.add(ok?'ok':'bad'); } else if(isT){ b.classList.add('ok'); } else { b.classList.add('faded'); } });
  if(ok)score++; smeta.textContent=score+' ✓';
  expl.innerHTML=(ok?'✅ ¡Era '+r.t.name+'! ':'❌ Era <b>'+r.t.name+'</b> ('+r.t.code+'). ')+r.clues.join(' '); expl.classList.add('show'); nextb.classList.add('show');
  engageReact('adivina-r'+(idx+1), ok?'correct':'wrong'); }
nextb.addEventListener('click',function(){ if(!answered)return; if(idx<R.length-1){idx++;render();window.scrollTo({top:0,behavior:'smooth'});} else finish(); });
function finish(){ document.getElementById('game').classList.add('hidden'); document.getElementById('end').classList.remove('hidden');
  var sb=document.getElementById('sb'),n=0; var iv=setInterval(function(){n++;sb.textContent=n;if(n>=score)clearInterval(iv);},170); if(score===0)sb.textContent='0';
  document.getElementById('ss').textContent='de '+R.length+' adivinadas'; var p=score/R.length;
  document.getElementById('bd').textContent= p===1?'🏆 ¡Conocés cada rincón!':p>=.6?'🌿 Muy bien':p>=.3?'🌱 Ahí va':'😅 A recorrer el jardín';
  engageReact('adivina-score', score+'/'+R.length); }
render();
