<!doctype html>
<!--
SPLASH FOTOGRÁFICO 2/3 — «El gigante del fondo» (tilt-up cinemascope)
Técnica de cine: plano de presentación de personaje. La foto REAL del
liquidámbar (misma toma que la del usuario) se recorre de abajo hacia arriba —
del pie del tronco a la copa — como una cámara en grúa; el tilt-up ES el
progreso de carga. Barras de cinemascope (2.39:1) enmarcan el plano y se
retraen recién en el remate: entrar al sitio = salir del cine. Gradación de
invierno: azul acero frío que se templa hasta luz de mañana con rim cálido
arriba; niebla baja que se disuelve al pie. Todo transform/opacity
(compositor-only). Mismo contrato del splash de producción (curva con
vacilación, % pill, microcopy, wash a crema + settle). En producción la foto
iría desde docs/images/ (cacheable), no base64. Reduced-motion: sin pan, la
copa entera con crossfades.
-->
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<title>Splash foto B — El gigante del fondo</title>
<style>
  html,body{height:100%;margin:0;background:#060a14;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #sp{position:fixed;inset:0;overflow:hidden;background:#060a14;user-select:none;cursor:pointer}
  #sp *{margin:0;padding:0;box-sizing:border-box}

  /* la foto, más alta que el viewport: el translateY es la grúa */
  #ph{position:absolute;inset:0;overflow:hidden}
  #ph img{position:absolute;left:50%;top:0;height:164vh;width:auto;max-width:none;
    transform:translate(-50%,-74vh) scale(1.06);transform-origin:50% 0;will-change:transform;display:block}

  .gr{position:absolute;inset:0;pointer-events:none;will-change:opacity}
  #grCold{background:linear-gradient(180deg,#16223f 0%,#1d2a4a 55%,#242c48 100%);mix-blend-mode:multiply;opacity:1}
  #grCold2{background:#1a2440;mix-blend-mode:color;opacity:.4}
  #grRim{background:linear-gradient(180deg,rgba(255,196,120,.42),rgba(255,170,100,.12) 34%,transparent 62%);mix-blend-mode:screen;opacity:0}
  #grAir{background:radial-gradient(ellipse 130% 70% at 50% 0%,rgba(190,214,255,.22),transparent 60%);mix-blend-mode:screen;opacity:0}
  #vig{background:radial-gradient(ellipse 130% 100% at 50% 46%,transparent 55%,rgba(3,5,14,.66) 100%)}

  #fog{position:absolute;left:-10%;width:120%;height:16vh;bottom:9vh;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(206,220,240,.5) 45%,rgba(206,220,240,.12) 85%,transparent);
    filter:blur(8px);opacity:0;animation:drift 9s ease-in-out infinite alternate;will-change:opacity}
  @keyframes drift{from{transform:translateX(-2.5%)}to{transform:translateX(2.5%)}}

  /* cinemascope */
  .bar{position:absolute;left:0;right:0;height:10.5vh;background:#000;z-index:8;transition:transform 1.1s cubic-bezier(.66,0,.22,1)}
  #barT{top:0;transform-origin:top}
  #barB{bottom:0;transform-origin:bottom}
  #sp.washing #barT{transform:translateY(-100%)}
  #sp.washing #barB{transform:translateY(100%)}

  #pctW{position:absolute;right:16px;top:calc(10.5vh + 12px);z-index:9;opacity:0;transition:opacity .5s}
  #pctW .in{font:500 12px/1 inherit;font-family:inherit;letter-spacing:.14em;font-variant-numeric:tabular-nums;color:#eef2fa;background:rgba(5,9,20,.62);padding:6px 11px;border-radius:999px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #copy{position:absolute;left:0;right:0;bottom:calc(10.5vh + 14px);z-index:9;text-align:center;padding:0 28px;font:400 14.5px/1.45 inherit;font-family:inherit;color:rgba(240,244,252,.94);text-shadow:0 1px 8px rgba(3,5,14,.8);transition:opacity .24s ease}

  #wash{position:absolute;inset:0;z-index:11;background:radial-gradient(circle at 50% 34%,#fff6dc 0%,#f8f9ec 34%,#f5faf0 62%);clip-path:circle(0% at 50% 34%);transition:clip-path 1.05s cubic-bezier(.66,0,.22,1);pointer-events:none}
  #sp.washing #wash{clip-path:circle(142% at 50% 34%)}
  #sp.washing #pctW,#sp.washing #copy,#sp.washing #fog{opacity:0!important;transition:opacity .4s ease}
  #final{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;visibility:hidden}
  #sp.reveal #final{visibility:visible}
  #final .title{font:400 clamp(34px,9.5vw,46px)/1.1 Georgia,serif;color:#2d5016;letter-spacing:.13em;opacity:0;transform:translateY(14px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.16,.8,.24,1),letter-spacing 1.15s cubic-bezier(.2,.7,.2,1)}
  #final .sub{margin-top:10px;font:600 11px inherit;font-family:inherit;letter-spacing:.22em;text-transform:uppercase;color:#4a5f3d;opacity:0;transform:translateY(10px);transition:opacity .7s ease .15s,transform .8s cubic-bezier(.16,.8,.24,1) .15s}
  #final .cta{display:inline-flex;align-items:center;gap:9px;margin-top:24px;padding:13px 26px;border-radius:999px;background:#2d5016;color:#f5faf0;text-decoration:none;font:600 15px/1 inherit;font-family:inherit;box-shadow:0 10px 24px -8px rgba(45,80,22,.45);opacity:0;transform:translateY(12px);transition:opacity .7s ease .3s,transform .8s cubic-bezier(.16,.8,.24,1) .3s}
  #sp.reveal .title{opacity:1;transform:none;letter-spacing:.02em}
  #sp.reveal .sub,#sp.reveal .cta{opacity:1;transform:none}

  #again{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:15;background:rgba(8,12,24,.35);border:1px solid rgba(230,236,248,.3);color:rgba(230,236,248,.9);font:500 12px inherit;font-family:inherit;padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
  #foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2.2vh);z-index:14;text-align:center;font:400 10px inherit;font-family:inherit;letter-spacing:.07em;text-transform:uppercase;color:rgba(230,236,248,.55);pointer-events:none}
  #sp.reveal~#foot{color:rgba(90,110,75,.9)}

  @media (prefers-reduced-motion: reduce){
    #ph img{height:120vh;transform:translate(-50%,-10vh)!important}
    #fog{animation:none!important}
    #wash{clip-path:none!important;opacity:0;transition:opacity .95s ease}
    #sp.washing #wash{opacity:1}
    .bar{transition:opacity .9s ease}
    #sp.washing .bar{opacity:0;transform:none}
    #final .title,#final .sub,#final .cta{transform:none!important;letter-spacing:.02em!important;transition:opacity .8s ease!important}
  }
</style>
</head>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const sp=$('sp'),img=$('phimg'),grC=$('grCold'),grC2=$('grCold2'),grR=$('grRim'),
      grA=$('grAir'),vig=$('vig'),fog=$('fog'),pctW=$('pctW'),pct=$('pct'),copy=$('copy');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR=5200;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
const lerp=(a,b,t)=>a+(b-a)*t;
const KEYS=[[0,0],[.13,.05],[.3,.4],[.5,.64],[.62,.74],[.72,.78],[.84,.81],[.92,.92],[1,1]];
function curve(u){
  if(u>=1)return 1;
  for(let i=1;i<KEYS.length;i++){
    if(u<=KEYS[i][0]){const a=KEYS[i-1],b=KEYS[i],k=(u-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*(k*k*(3-2*k))}
  }
  return 1;
}
const COPY=['El fondo duerme, todo en silencio…','Subiendo por el tronco, rama a rama…','La copa entera contra el cielo…','El gigante despierta. Vos también.'];

function render(p){
  if(!reduced){
    /* grúa + pull-back: sube por el tronco cerrada y sobre el final la cámara
       se abre (scale 1.06→.62 = alto 164vh→~102vh) hasta revelar el árbol
       ENTERO contra el cielo — el clásico "pull back to reveal" */
    const sc=1.06-.44*ss(.42,.86,p);
    const gap=Math.max(164*sc-100,0);
    const ty=-gap*(1-ss(.02,.96,p));
    img.style.transform=`translate(-50%,${ty.toFixed(2)}vh) scale(${sc.toFixed(4)})`;
  }
  grC.style.opacity=(1-ss(.12,.72,p)).toFixed(3);
  grC2.style.opacity=(.4*(1-ss(.15,.65,p))).toFixed(3);
  grA.style.opacity=(ss(.2,.5,p)*(1-.4*ss(.85,1,p))).toFixed(3);
  grR.style.opacity=ss(.55,.85,p).toFixed(3);
  vig.style.opacity=(1-.5*p).toFixed(3);
  fog.style.opacity=(.6*ss(.02,.18,p)*(1-ss(.3,.6,p))).toFixed(3);
  const n=Math.round(p*100);
  pct.textContent=n;pctW.setAttribute('aria-valuenow',n);
  pctW.style.opacity=p>.04?'1':'0';
}
function frame(now){
  if(!t0)t0=now;
  let u=Math.min((now-t0)/DUR,1);
  if(skip){u=Math.min(u+.55,1);t0=now-u*DUR}
  const p=curve(u);
  if(ci<COPY.length-1&&(now-t0)>=CT[ci+1]){
    ci++;const txt=COPY[ci];clearTimeout(copyT);
    copy.style.opacity=0;
    copyT=setTimeout(()=>{copy.textContent=txt;copy.style.opacity=1},220);
  }
  render(p);
  if(u<1)raf=requestAnimationFrame(frame);else finale();
}
function finale(){
  finaleOn=true;
  finT.push(setTimeout(()=>sp.classList.add('washing'),220));
  finT.push(setTimeout(()=>sp.classList.add('reveal'),780));
}
function reset(){
  cancelAnimationFrame(raf);clearTimeout(copyT);finT.forEach(clearTimeout);finT=[];
  sp.classList.remove('washing','reveal');
  skip=false;finaleOn=false;t0=0;ci=0;
  copy.textContent=COPY[0];copy.style.opacity=1;
  render(0);
  raf=requestAnimationFrame(frame);
}
sp.addEventListener('pointerdown',e=>{
  if(e.target.closest('a,button'))return;
  if(!finaleOn)skip=true;
},{passive:true});
$('again').addEventListener('click',reset);
render(0);
raf=requestAnimationFrame(frame);
})();
</script>
</body>
