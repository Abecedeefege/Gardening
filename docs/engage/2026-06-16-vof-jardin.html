<div class="top"><a href="https://gardening-chi.vercel.app/index.html">← Volver al sitio estable</a>

<script>
var P = [{"code": "F-1", "name": "Guayabo del país", "zone": "frente", "nat": true, "fru": true, "perf": false, "trep": false}, {"code": "F-2", "name": "Bignonia rosada / Podranea", "zone": "frente", "nat": false, "fru": false, "perf": false, "trep": true}, {"code": "F-3", "name": "Fotinia", "zone": "frente", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "F-4", "name": "Ciruelo de jardín", "zone": "frente", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "F-7", "name": "Abelia", "zone": "frente", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "F-8", "name": "Aguaribay / Molle", "zone": "frente", "nat": true, "fru": false, "perf": true, "trep": false}, {"code": "F-9", "name": "Ligustro", "zone": "frente", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "F-10", "name": "Fresno (americano)", "zone": "frente", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-1", "name": "Santa Rita / Buganvilia", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": true}, {"code": "B-3", "name": "Jazmín de leche / estrellado", "zone": "fondo", "nat": false, "fru": false, "perf": true, "trep": true}, {"code": "B-4", "name": "Hibisco / Rosa china", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-5a", "name": "Hortensia", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-7", "name": "Azarero / Pitósporo", "zone": "fondo", "nat": false, "fru": false, "perf": true, "trep": false}, {"code": "B-8", "name": "Palmera pindó", "zone": "fondo", "nat": true, "fru": true, "perf": false, "trep": false}, {"code": "B-9", "name": "Crespón / Mirto de crepe", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-10", "name": "Lavanda", "zone": "fondo", "nat": false, "fru": false, "perf": true, "trep": false}, {"code": "B-13", "name": "Clivia / Lirio del Cabo", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-14", "name": "Lapachillo", "zone": "fondo", "nat": true, "fru": false, "perf": false, "trep": false}, {"code": "B-15", "name": "Hiedra común", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": true}, {"code": "B-16", "name": "Anacahuita", "zone": "fondo", "nat": true, "fru": false, "perf": false, "trep": false}, {"code": "B-18", "name": "Rosa de Siria / Althea", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-22", "name": "Palta uruguaya", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-23", "name": "Limonero", "zone": "fondo", "nat": false, "fru": true, "perf": true, "trep": false}, {"code": "B-24", "name": "Mandarina criolla", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-25", "name": "Gardenia / Jazmín del Cabo", "zone": "fondo", "nat": false, "fru": false, "perf": true, "trep": false}, {"code": "B-26", "name": "Romero", "zone": "fondo", "nat": false, "fru": false, "perf": true, "trep": false}, {"code": "B-27", "name": "Mirto común", "zone": "fondo", "nat": false, "fru": false, "perf": true, "trep": false}, {"code": "B-29", "name": "Lantana / Camará", "zone": "fondo", "nat": true, "fru": false, "perf": false, "trep": false}, {"code": "B-30", "name": "Durazno", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-32", "name": "Viraró", "zone": "fondo", "nat": true, "fru": false, "perf": false, "trep": false}, {"code": "B-36", "name": "Palta Haas", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-37", "name": "Liquidámbar", "zone": "fondo", "nat": false, "fru": false, "perf": false, "trep": false}, {"code": "B-38", "name": "Ciruela amarilla", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-39", "name": "Pera Williams", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-41", "name": "Caqui / Persimón", "zone": "fondo", "nat": false, "fru": true, "perf": false, "trep": false}, {"code": "B-42", "name": "Pata de vaca", "zone": "fondo", "nat": true, "fru": false, "perf": false, "trep": false}, {"code": "B-43", "name": "Pitósporo", "zone": "fondo", "nat": false, "fru": false, "perf": true, "trep": false}];
function emoji(p){ return p.fru?'🍑':p.perf?'🌸':p.trep?'🌿':p.nat?'🌳':'🌱'; }
var DIMS=[
 {key:'nat', t:function(p){return p.name+' es una planta NATIVA del Uruguay.';}, e:function(p){return p.nat? '<b>Verdadero.</b> '+p.name+' es nativa del Uruguay/la región.' : '<b>Falso.</b> '+p.name+' es exótica (introducida), no nativa.';}},
 {key:'fru', t:function(p){return p.name+' te da FRUTA comestible.';}, e:function(p){return p.fru? '<b>Verdadero.</b> '+p.name+' es frutal: da fruta para comer.' : '<b>Falso.</b> '+p.name+' es ornamental, no da fruta comestible.';}},
 {key:'perf', t:function(p){return p.name+' es AROMÁTICA o perfumada.';}, e:function(p){return p.perf? '<b>Verdadero.</b> '+p.name+' destaca por su aroma o perfume.' : '<b>Falso.</b> '+p.name+' no se caracteriza por su perfume.';}},
 {key:'trep', t:function(p){return p.name+' es una planta TREPADORA.';}, e:function(p){return p.trep? '<b>Verdadero.</b> '+p.name+' es trepadora: necesita soporte.' : '<b>Falso.</b> '+p.name+' no es trepadora.';}},
 {key:'zone', t:function(p){return p.name+' está plantada en el FONDO (lado este) del jardín.';}, e:function(p){return p.zone==='fondo'? '<b>Verdadero.</b> '+p.name+' está en el fondo (lado este, sol de mañana).' : '<b>Falso.</b> '+p.name+' está en el frente (lado oeste, sol de tarde).';}, val:function(p){return p.zone==='fondo';}},
];
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function val(d,p){ return d.val? d.val(p) : !!p[d.key]; }
function makeRounds(n){
  var out=[], tries=0, wantTrue=true, usedCode={};
  while(out.length<n && tries<600){ tries++;
    var d=rnd(DIMS);
    var pool=P.filter(function(p){ return val(d,p)===wantTrue && !usedCode[d.key+p.code]; });
    if(!pool.length){ wantTrue=!wantTrue; continue; }
    var p=rnd(pool); usedCode[d.key+p.code]=1;
    out.push({dim:d, plant:p, truth:wantTrue});
    wantTrue=!wantTrue; // alternar verdadero/falso para equilibrar
  }
  return out;
}
var R=makeRounds(7), idx=0, score=0, answered=false;
var em=document.getElementById('em'),cd=document.getElementById('cd'),stmt=document.getElementById('stmt'),
    bT=document.getElementById('bT'),bF=document.getElementById('bF'),expl=document.getElementById('expl'),
    nextb=document.getElementById('next'),rmeta=document.getElementById('rmeta'),smeta=document.getElementById('smeta');
function render(){ answered=false; var r=R[idx]; em.textContent=emoji(r.plant); cd.textContent=r.plant.code;
  stmt.textContent=r.dim.t(r.plant); rmeta.textContent='Ronda '+(idx+1)+' de '+R.length; smeta.textContent=score+' ✓';
  bT.className=''; bF.className=''; bT.disabled=false; bF.disabled=false; expl.className='expl'; nextb.className='next';
  nextb.textContent= idx===R.length-1?'Ver resultado →':'Siguiente →'; }
function pick(said){ if(answered)return; answered=true; var r=R[idx]; var ok=(said===r.truth);
  bT.disabled=true; bF.disabled=true; var saidBtn=said?bT:bF, trueBtn=r.truth?bT:bF;
  if(ok){ saidBtn.classList.add('ok'); score++; } else { saidBtn.classList.add('bad'); trueBtn.classList.add('ok'); }
  smeta.textContent=score+' ✓'; expl.innerHTML=(ok?'✅ ¡Bien! ':'❌ ')+r.dim.e(r.plant); expl.classList.add('show'); nextb.classList.add('show');
  engageReact('vof-r'+(idx+1), ok?'correct':'wrong'); }
bT.addEventListener('click',function(){pick(true);}); bF.addEventListener('click',function(){pick(false);});
nextb.addEventListener('click',function(){ if(!answered)return; if(idx<R.length-1){idx++;render();window.scrollTo({top:0,behavior:'smooth'});} else finish(); });
function finish(){ document.getElementById('game').classList.add('hidden'); document.getElementById('end').classList.remove('hidden');
  var sb=document.getElementById('sb'),n=0; var iv=setInterval(function(){n++;sb.textContent=n;if(n>=score)clearInterval(iv);},150); if(score===0)sb.textContent='0';
  document.getElementById('ss').textContent='de '+R.length+' acertadas';
  var pc=score/R.length; document.getElementById('bd').textContent= pc===1?'🏆 ¡Lo sabés todo!':pc>=.7?'🌿 Muy bien':pc>=.4?'🌱 Vas aprendiendo':'😅 A repasar el jardín';
  engageReact('vof-score', score+'/'+R.length); }
render();
</script></body></html>
